name: Mirrors

# Standalone: no other workflow depends on it; a failed mirror only warns and the next push retries.
on:
  push:
    branches: [main]
    tags: ['**']
  workflow_dispatch:
    inputs:
      probe_failure:
        description: Point the GitVerse leg at an unreachable host to prove a failed mirror keeps the run green
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  push:
    name: push (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gitflic
            url: git@gitflic.ru:brewcode/brewpage-openapi.git
          - name: sourcecraft
            url: git@ssh.sourcecraft.dev:kochetkov-ma/brewpage-openapi.git
          - name: gitverse
            url: git@gitverse.ru:brewpage/brewpage-openapi.git
    concurrency:
      group: mirrors-${{ matrix.name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Push main and tags
        id: push
        continue-on-error: true
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_URL: ${{ (inputs.probe_failure && matrix.name == 'gitverse') && 'git@mirror-probe.invalid:none/none.git' || matrix.url }}
          # Pinned host keys; all three hosts offer only RSA host keys.
          KNOWN_HOSTS: |
            gitflic.ru ssh-rsa 
            ssh.sourcecraft.dev ssh-rsa 
            gitverse.ru ssh-rsa 
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/mirror_key"
          hosts="$RUNNER_TEMP/mirror_known_hosts"
          printf '%s\n' "$MIRROR_SSH_KEY" > "$key"
          printf '%s' "$KNOWN_HOSTS" > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts"
          git push "$MIRROR_URL" refs/remotes/origin/main:refs/heads/main
          git push "$MIRROR_URL" --tags

      - name: Warn on a failed mirror
        if: steps.push.outcome == 'failure'
        run: echo "::warning title=Mirror ${{ matrix.name }}::push failed; the next push or a manual run retries it"
