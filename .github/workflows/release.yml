name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Publish {0} at {1}', inputs.release_tag || github.ref_name, fromJSON(inputs.hosted_receipt || '{}').revision) || format('Build {0}', github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable release tag when running the publishing workflow from main"
        type: string
        required: false
      hosted_receipt:
        description: "Reviewed sanitized hosted qualification receipt JSON for this exact release tag"
        type: string
        required: true
      hosted_receipt_sha256:
        description: "SHA-256 of the exact receipt bytes"
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kochetkov-ma/brewpage-mcp

concurrency:
  group: mcp-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.3'

      - name: Validate release identity
        id: identity
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./mcp-server/package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          RELEASE_TAG="v${VERSION}"
          if [[ "$RELEASE_REF" != "$RELEASE_TAG" ]]; then
            echo '::error::Release tag does not match the package manifest'
            exit 1
          fi
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "$GITHUB_SHA" ]] || exit 1
          node scripts/verify-package-identity.mjs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Labels: OCI + Artifact Hub (readme-url, created, description are required for a listed tag).
      - name: Build image
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          DESCRIPTION=$(node -p "require('./mcp-server/package.json').description")
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          docker build mcp-server --tag "${IMAGE}:${VERSION}" \
            --label "org.opencontainers.image.source=${REPO_URL}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=${CREATED}" \
            --label "org.opencontainers.image.description=${DESCRIPTION}" \
            --label "org.opencontainers.image.title=BrewPage MCP" \
            --label "org.opencontainers.image.url=https://brewpage.app" \
            --label "org.opencontainers.image.documentation=${REPO_URL}/tree/${GITHUB_SHA}/mcp-server#readme" \
            --label "org.opencontainers.image.vendor=BrewPage" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/mcp-server/README.md" \
            --label "io.artifacthub.package.license=MIT" \
            --label "io.artifacthub.package.logo-url=https://brewpage.app/icon-512.png" \
            --label "io.artifacthub.package.category=ai-machine-learning" \
            --label "io.artifacthub.package.keywords=mcp,model context protocol,brewpage,html hosting,publish,ai agents" \
            --label 'io.artifacthub.package.maintainers=[{"name":"BrewPage","email":"info@brewpage.app"}]'
          docker image inspect "${IMAGE}:${VERSION}" --format '{{json .Config.Labels}}' > "$RUNNER_TEMP/labels.json"
          for KEY in io.artifacthub.package.readme-url org.opencontainers.image.created org.opencontainers.image.description; do
            jq -e --arg k "$KEY" '.[$k] | type == "string" and length > 0' "$RUNNER_TEMP/labels.json" >/dev/null || {
              echo "::error::image label ${KEY} missing"
              exit 1
            }
          done

      - name: Smoke-test image over HTTP
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          for CATALOG in legacy compact; do
            bash scripts/smoke-image.sh "${IMAGE}:${VERSION}" "$VERSION" "$CATALOG"
          done

      - name: Push image to GHCR
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          SMOKED_ID=
          if docker manifest inspect "${IMAGE}:${VERSION}" > "$RUNNER_TEMP/manifest.json" 2> "$RUNNER_TEMP/manifest.err"; then
            echo "::notice::${IMAGE}:${VERSION} already exists, push skipped (tags are immutable)"
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          elif grep -qiE 'no such manifest|manifest unknown|not found' "$RUNNER_TEMP/manifest.err"; then
            SMOKED_ID=$(docker image inspect --format '{{.Id}}' "${IMAGE}:${VERSION}")
            [[ "$SMOKED_ID" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            docker push "${IMAGE}:${VERSION}"
            DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")
            DIGEST="${DIGEST##*@}"
          else
            cat "$RUNNER_TEMP/manifest.err"
            echo '::error::GHCR manifest lookup failed; push stopped'
            exit 1
          fi
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          PIN="${IMAGE}:${VERSION}@${DIGEST}"
          docker pull "$PIN"
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PIN")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$PIN")" == "$VERSION" ]] || exit 1
          if [[ -n "$SMOKED_ID" ]]; then
            [[ "$(docker image inspect --format '{{.Id}}' "$PIN")" == "$SMOKED_ID" ]] || exit 1
          else
            for CATALOG in legacy compact; do
              bash scripts/smoke-image.sh "$PIN" "$VERSION" "$CATALOG"
            done
          fi
          {
            echo '### brewpage-mcp image'
            echo "- Tag: \`${IMAGE}:${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pin: \`${IMAGE}:${VERSION}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  qualification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.receipt.outputs.tag }}
      revision: ${{ steps.receipt.outputs.revision }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.3'

      - name: Validate reviewed hosted receipt and release identity
        id: receipt
        env:
          SELECTED_TAG: ${{ inputs.release_tag }}
          HOSTED_RECEIPT: ${{ inputs.hosted_receipt }}
          HOSTED_RECEIPT_SHA256: ${{ inputs.hosted_receipt_sha256 }}
        run: |
          set -euo pipefail
          refuse() { echo "::error::$1"; exit 1; }
          case "$GITHUB_REF" in
            refs/heads/main) RELEASE_TAG="$SELECTED_TAG" ;;
            refs/tags/*)
              RELEASE_TAG="${GITHUB_REF#refs/tags/}"
              [[ -z "$SELECTED_TAG" || "$SELECTED_TAG" == "$RELEASE_TAG" ]] || refuse 'Selected tag differs from the dispatch tag'
              ;;
            *) refuse 'Dispatch at main with a selected release tag, or at the release tag' ;;
          esac
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || refuse 'Select an exact stable release tag'
          REVISION=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}") || refuse 'Selected release tag does not exist'
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] || refuse 'Invalid release tag revision'
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            git merge-base --is-ancestor "$REVISION" "$GITHUB_SHA" || refuse 'Selected artifact is outside the main workflow history'
          else
            [[ "$REVISION" == "$GITHUB_SHA" ]] || refuse 'Release tag commit does not match the dispatch revision'
          fi
          git switch --detach "$REVISION"
          [[ "$(git rev-parse HEAD)" == "$REVISION" ]] || refuse 'Artifact checkout revision mismatch'
          node scripts/verify-package-identity.mjs
          VERSION=$(node -p "require('./mcp-server/package.json').version")
          [[ "$RELEASE_TAG" == "v${VERSION}" ]] || refuse 'Release tag does not match the package version'
          [[ "$HOSTED_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]] || refuse 'Expected the receipt SHA-256 in lowercase hex'
          printf '%s' "$HOSTED_RECEIPT" > "$RUNNER_TEMP/hosted-receipt.json"
          echo "$HOSTED_RECEIPT_SHA256  $RUNNER_TEMP/hosted-receipt.json" | sha256sum --check --strict -
          jq -es --arg version "$VERSION" --arg revision "$REVISION" --arg image "${IMAGE}:${VERSION}@" '
            def semver: test("^[0-9]+\\.[0-9]+\\.[0-9]+$");
            def positive_integer: type == "number" and . >= 1 and floor == .;
            def fresh: fromdateiso8601 as $observed | now - $observed | . >= -60 and . <= 1800;
            length == 1 and (.[0]
              | keys == ["appVersion","catalog","endpoint","evidenceSha256","image","qualification","revision","runtime","version"]
              and .version == $version and .revision == $revision
              and .endpoint == "https://brewpage.app/mcp" and .catalog == "compact"
              and (.image | startswith($image) and (ltrimstr($image) | test("^sha256:[0-9a-f]{64}$")))
              and (.appVersion | semver)
              and (.evidenceSha256 | test("^[0-9a-f]{64}$"))
              and .qualification == {
                anonymousCreateAndUpdate: "pass", cachedLegacyCalls: "pass", nativeOAuthConsentAndReturn: "pass",
                signedOwnerReadback: "pass", invalidBearerNoWrite: "pass", compatibleRecovery: "pass"
              }
              and (. as $receipt | .runtime
                | keys == ["appBuildVersion","appImage","appVersion","bearerForwarding","catalog","deployRunAttempt","deployRunId","grantIssuance","mcpImage","mcpImageId","mcpRevision","observedAt"]
                and .appVersion == $receipt.appVersion and (.appBuildVersion | semver)
                and (.appImage | test("^ghcr\\.io/kochetkov-ma/brewpage-app-backend@sha256:[0-9a-f]{64}$"))
                and .mcpImage == $receipt.image and .mcpRevision == $revision
                and (.mcpImageId | test("^sha256:[0-9a-f]{64}$"))
                and .catalog == $receipt.catalog and .bearerForwarding == true and .grantIssuance == true
                and (.deployRunId | positive_integer) and (.deployRunAttempt | positive_integer)
                and (.observedAt | fresh)))
          ' "$RUNNER_TEMP/hosted-receipt.json" > /dev/null || refuse 'Hosted receipt does not match this candidate and all required qualification rows'
          PIN=$(jq -r .image "$RUNNER_TEMP/hosted-receipt.json")
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          [[ "$PIN" == "${IMAGE}:${VERSION}@${DIGEST}" ]] || refuse 'Hosted receipt pin does not match the GHCR version digest'
          MANIFEST="$RUNNER_TEMP/mcp-manifest.json"
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" > "$MANIFEST"
          echo "${DIGEST#sha256:}  $MANIFEST" | sha256sum --check --strict -
          CONFIG_DIGEST=$(jq -er '
            select(.schemaVersion == 2 and (has("manifests") | not) and (.layers | type == "array"))
            | .config.digest | select(test("^sha256:[0-9a-f]{64}$"))
          ' "$MANIFEST") || refuse 'Expected one image manifest with a versioned config digest'
          IMAGE_ID=$(jq -r .runtime.mcpImageId "$RUNNER_TEMP/hosted-receipt.json")
          [[ "$IMAGE_ID" == "$DIGEST" || "$IMAGE_ID" == "$CONFIG_DIGEST" ]] || refuse 'Observed MCP container image ID does not match the verified manifest or config'
          docker pull --platform linux/amd64 "$PIN"
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$PIN")" == linux/amd64 ]] || refuse 'OCI image platform must be Linux amd64'
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PIN")" == "$REVISION" ]] || refuse 'OCI revision does not match the release tag'
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$PIN")" == "$VERSION" ]] || refuse 'OCI version does not match the package version'
          {
            echo "tag=$RELEASE_TAG"
            echo "revision=$REVISION"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Artifact revision: \`$REVISION\`, publishing workflow revision: \`$GITHUB_SHA\`"
            echo "Hosted qualification receipt SHA-256: \`${HOSTED_RECEIPT_SHA256}\` for \`${PIN}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recheck hosted discovery and OAuth without writes
        env:
          VERSION: ${{ steps.receipt.outputs.version }}
        run: node scripts/smoke-http.mjs "$VERSION" compact --hosted

  release:
    needs: qualification
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'workflow_dispatch' && needs.qualification.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.qualification.outputs.revision }}
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.3'

      - name: Install pinned npm with trusted publishing support
        run: |
          set -euo pipefail
          npm install --global npm@11.14.1
          [[ "$(npm --version)" == 11.14.1 ]] || exit 1

      - name: Install and build MCP server
        working-directory: mcp-server
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Run MCP smoke tests
        working-directory: mcp-server
        run: npm test

      # People-facing notes: the "## MCP <version>" section of RELEASE-NOTES.md, never only a changelog link.
      - name: Release notes from RELEASE-NOTES.md
        env:
          RELEASE_TAG: ${{ needs.qualification.outputs.tag }}
        run: |
          set -euo pipefail
          awk -v head="## MCP ${RELEASE_TAG#v} " 'index($0, head) == 1 {on = 1; next} on && /^## / {exit} on {print}' RELEASE-NOTES.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=RELEASE-NOTES.md::no '## MCP ${RELEASE_TAG#v}' section; write the people-facing notes before tagging"
            exit 1
          fi

      - name: Check if version already published
        id: check
        working-directory: mcp-server
        env:
          ARTIFACT_REVISION: ${{ needs.qualification.outputs.revision }}
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --json > "$RUNNER_TEMP/npm-version.json" 2> "$RUNNER_TEMP/npm-version.err"; then
            node -e 'const fs=require("fs"); if(JSON.parse(fs.readFileSync(process.argv[1],"utf8"))!==process.argv[2]) process.exit(1)' "$RUNNER_TEMP/npm-version.json" "$PKG_VERSION"
            [[ "$(npm view "${PKG_NAME}@${PKG_VERSION}" gitHead)" == "$ARTIFACT_REVISION" ]] || {
              echo '::error::Published version belongs to another Git revision'
              exit 1
            }
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} already published, skipping"
          elif node -e 'const fs=require("fs"); try {if(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).error.code!=="E404") process.exit(1)} catch {process.exit(1)}' "$RUNNER_TEMP/npm-version.json"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} not found, will publish"
          else
            echo '::error::npm version lookup failed; publication stopped'
            exit 1
          fi

      - &verify_remote_tag
        name: Revalidate the remote artifact tag
        env:
          RELEASE_TAG: ${{ needs.qualification.outputs.tag }}
          ARTIFACT_REVISION: ${{ needs.qualification.outputs.revision }}
        run: |
          set -euo pipefail
          REF="refs/tags/$RELEASE_TAG"
          REMOTE_TAGS=$(git ls-remote --exit-code origin "$REF" "$REF^{}")
          REVISION=$(awk -v ref="$REF" '
            $2 == ref { direct = $1; direct_count++ }
            $2 == ref "^{}" { peeled = $1; peeled_count++ }
            END {
              if (direct_count != 1 || peeled_count > 1) exit 1
              print (peeled_count == 1 ? peeled : direct)
            }
          ' <<< "$REMOTE_TAGS")
          [[ "$REVISION" == "$ARTIFACT_REVISION" ]] || {
            echo "::error::Remote release tag no longer resolves to the qualified revision"
            exit 1
          }

      - name: Publish to npm
        if: steps.check.outputs.exists != 'true'
        working-directory: mcp-server
        run: npm publish --access public --provenance

  registry:
    needs: [qualification, release]
    if: github.event_name == 'workflow_dispatch' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.qualification.outputs.revision }}
          persist-credentials: false

      - name: Validate server.json
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r .version mcp-server/package.json)
          LEN=$(jq -r '.description | length' server.json)
          if [[ "$LEN" -gt 100 ]]; then
            echo "::error file=server.json::description is ${LEN} chars; the MCP registry limit is 100"
            exit 1
          fi
          jq -e --arg v "$PKG_VERSION" '.version == $v and (.packages | all(.version == $v))' server.json >/dev/null || {
            echo "::error file=server.json::version stamps do not match mcp-server/package.json ${PKG_VERSION}"
            exit 1
          }

      - name: Install pinned mcp-publisher
        run: |
          set -euo pipefail
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${ARCHIVE}"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/mcp-publisher"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher
          echo "$RUNNER_TEMP/mcp-publisher" >> "$GITHUB_PATH"

      - name: Validate against registry schema
        run: |
          set -euo pipefail
          mcp-publisher validate server.json

      - name: Wait for npm to serve the exact revision
        env:
          ARTIFACT_REVISION: ${{ needs.qualification.outputs.revision }}
        run: |
          set -euo pipefail
          PKG_NAME=$(jq -r .name mcp-server/package.json)
          PKG_VERSION=$(jq -r .version mcp-server/package.json)
          URL="https://registry.npmjs.org/${PKG_NAME}/${PKG_VERSION}"
          DEADLINE=$((SECONDS + 600))
          while true; do
            CODE=$(curl -s -o "$RUNNER_TEMP/npm-release.json" -w '%{http_code}' --max-time 20 "$URL" || true)
            if [[ "$CODE" == 200 ]]; then
              jq -e --arg version "$PKG_VERSION" --arg revision "$ARTIFACT_REVISION" \
                '.version == $version and .gitHead == $revision' "$RUNNER_TEMP/npm-release.json" >/dev/null
              echo "npm serves ${PKG_NAME}@${PKG_VERSION}"
              break
            fi
            if (( SECONDS >= DEADLINE )); then
              echo "::error::npm did not serve ${PKG_NAME}@${PKG_VERSION} within 10 minutes (last HTTP ${CODE})"
              exit 1
            fi
            echo "HTTP ${CODE} for ${URL}; retrying in 15 s"
            sleep 15
          done

      - *verify_remote_tag

      - name: Publish to MCP registry
        run: |
          set -euo pipefail
          mcp-publisher login github-oidc
          if mcp-publisher publish server.json > "$RUNNER_TEMP/publish.log" 2>&1; then
            cat "$RUNNER_TEMP/publish.log"
          elif grep -q 'cannot publish duplicate version' "$RUNNER_TEMP/publish.log"; then
            echo 'Version already in the MCP registry, checking its descriptor'
          else
            cat "$RUNNER_TEMP/publish.log"
            echo '::error::MCP registry publish failed'
            exit 1
          fi

      - name: Verify official registry descriptor readback
        run: |
          set -euo pipefail
          NAME=$(jq -er '.name | @uri' server.json)
          VERSION=$(jq -er '.version | @uri' server.json)
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/$NAME/versions/$VERSION"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 \
            --output "$RUNNER_TEMP/registry-release.json" "$URL"
          jq -e --slurpfile expected server.json '
            ._meta["io.modelcontextprotocol.registry/official"].status == "active"
            and .server == ($expected[0] | del(.homepage, .categories, .keywords))
          ' "$RUNNER_TEMP/registry-release.json" >/dev/null || {
            echo '::error::Official registry does not serve the reviewed version descriptor'
            exit 1
          }

  advertise:
    needs: [qualification, registry]
    if: github.event_name == 'workflow_dispatch' && needs.registry.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.qualification.outputs.revision }}
          persist-credentials: false

      - name: Read reviewed release notes
        env:
          RELEASE_TAG: ${{ needs.qualification.outputs.tag }}
        run: |
          set -euo pipefail
          awk -v head="## MCP ${RELEASE_TAG#v} " 'index($0, head) == 1 {on = 1; next} on && /^## / {exit} on {print}' RELEASE-NOTES.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"

      - name: Verify an existing GitHub Release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.qualification.outputs.tag }}
          ARTIFACT_REVISION: ${{ needs.qualification.outputs.revision }}
        run: |
          set -euo pipefail
          RESPONSE="$RUNNER_TEMP/release-readback.json"
          ERROR="$RUNNER_TEMP/release-readback.err"
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RESPONSE" 2> "$ERROR"; then
            if grep -qx 'gh: Not Found (HTTP 404)' "$ERROR"; then
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$ERROR" >&2
            exit 1
          fi
          JSON_DIGEST=$(sha256sum openapi/openapi.json)
          YAML_DIGEST=$(sha256sum openapi/openapi.yaml)
          jq -e --arg tag "$RELEASE_TAG" --arg revision "$ARTIFACT_REVISION" \
            --rawfile notes "$RUNNER_TEMP/notes.md" --arg json "sha256:${JSON_DIGEST%% *}" --arg yaml "sha256:${YAML_DIGEST%% *}" '
              .tag_name == $tag and .name == $tag and .target_commitish == $revision
              and .draft == false and .prerelease == false
              and (.published_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T"))
              and .body == $notes
              and (.assets | map({name, state, digest}) | sort_by(.name)) == [
                {name: "openapi.json", state: "uploaded", digest: $json},
                {name: "openapi.yaml", state: "uploaded", digest: $yaml}
              ]
          ' "$RESPONSE" >/dev/null || {
            echo '::error::Existing GitHub Release differs from the reviewed artifact'
            exit 1
          }
          echo 'exists=true' >> "$GITHUB_OUTPUT"
          echo "Verified existing GitHub Release $RELEASE_TAG at $ARTIFACT_REVISION with exact notes and assets." >> "$GITHUB_STEP_SUMMARY"

      - *verify_remote_tag

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ needs.qualification.outputs.tag }}
