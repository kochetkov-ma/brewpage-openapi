name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '22.23.3'

      - name: Validate release identity
        id: identity
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./mcp-server/package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_TAG="v${VERSION}"
          if [[ "$RELEASE_EVENT" == push && "$RELEASE_REF" != "$RELEASE_TAG" ]]; then
            echo '::error::Release tag does not match the package manifest'
            exit 1
          fi
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          git diff --exit-code "$RELEASE_TAG" HEAD -- mcp-server
          node -e 'const p=require("./mcp-server/package.json"),l=require("./mcp-server/package-lock.json"); if(l.version!==p.version || l.packages[""].version!==p.version) process.exit(1)'
          node scripts/verify-package-identity.mjs
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install pinned npm with trusted publishing support
        run: |
          set -euo pipefail
          npm install --global npm@11.14.1
          [[ "$(npm --version)" == 11.14.1 ]]

      - name: Install and build MCP server
        working-directory: mcp-server
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Run MCP smoke tests
        working-directory: mcp-server
        run: npm test

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.identity.outputs.tag }}
          generate_release_notes: true
          files: |
            openapi/openapi.json
            openapi/openapi.yaml

      - name: Check if version already published
        id: check
        working-directory: mcp-server
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --json > "$RUNNER_TEMP/npm-version.json" 2> "$RUNNER_TEMP/npm-version.err"; then
            node -e 'const fs=require("fs"); if(JSON.parse(fs.readFileSync(process.argv[1],"utf8"))!==process.argv[2]) process.exit(1)' "$RUNNER_TEMP/npm-version.json" "$PKG_VERSION"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} already published, skipping"
          elif node -e 'const fs=require("fs"); try {if(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).error.code!=="E404") process.exit(1)} catch {process.exit(1)}' "$RUNNER_TEMP/npm-version.json"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} not found, will publish"
          else
            echo '::error::npm version lookup failed; publication stopped'
            exit 1
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists != 'true'
        working-directory: mcp-server
        run: npm publish --access public --provenance

  registry:
    needs: release
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Validate server.json
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r .version mcp-server/package.json)
          LEN=$(jq -r '.description | length' server.json)
          if [[ "$LEN" -gt 100 ]]; then
            echo "::error file=server.json::description is ${LEN} chars; the MCP registry limit is 100"
            exit 1
          fi
          jq -e --arg v "$PKG_VERSION" '.version == $v and (.packages | all(.version == $v))' server.json >/dev/null || {
            echo "::error file=server.json::version stamps do not match mcp-server/package.json ${PKG_VERSION}"
            exit 1
          }

      - name: Install pinned mcp-publisher
        run: |
          set -euo pipefail
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${ARCHIVE}"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/mcp-publisher"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher
          echo "$RUNNER_TEMP/mcp-publisher" >> "$GITHUB_PATH"

      - name: Validate against registry schema
        run: |
          set -euo pipefail
          mcp-publisher validate server.json

      - name: Wait for npm to serve the version
        run: |
          set -euo pipefail
          PKG_NAME=$(jq -r .name mcp-server/package.json)
          PKG_VERSION=$(jq -r .version mcp-server/package.json)
          URL="https://registry.npmjs.org/${PKG_NAME}/${PKG_VERSION}"
          DEADLINE=$((SECONDS + 600))
          while true; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)
            if [[ "$CODE" == 200 ]]; then
              echo "npm serves ${PKG_NAME}@${PKG_VERSION}"
              break
            fi
            if (( SECONDS >= DEADLINE )); then
              echo "::error::npm did not serve ${PKG_NAME}@${PKG_VERSION} within 10 minutes (last HTTP ${CODE})"
              exit 1
            fi
            echo "HTTP ${CODE} for ${URL}; retrying in 15 s"
            sleep 15
          done

      - name: Publish to MCP registry
        run: |
          set -euo pipefail
          mcp-publisher login github-oidc
          if mcp-publisher publish server.json > "$RUNNER_TEMP/publish.log" 2>&1; then
            cat "$RUNNER_TEMP/publish.log"
          elif grep -q 'cannot publish duplicate version' "$RUNNER_TEMP/publish.log"; then
            cat "$RUNNER_TEMP/publish.log"
            echo 'Version already in the MCP registry, skipping'
          else
            cat "$RUNNER_TEMP/publish.log"
            echo '::error::MCP registry publish failed'
            exit 1
          fi
