name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'

      - name: Verify the OpenAPI documents and their copies
        run: |
          set -euo pipefail
          npm ci --prefix docs
          node scripts/verify-openapi.mjs

      - name: Verify package identity
        run: |
          set -euo pipefail
          node scripts/verify-package-identity.mjs
          node scripts/verify-data-package.mjs packages/data

      - name: Test the MCP server
        working-directory: mcp-server
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Test brewpage-data
        working-directory: packages/data
        run: |
          set -euo pipefail
          npm ci
          npm test
