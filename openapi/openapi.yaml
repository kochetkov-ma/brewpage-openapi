  /api/sites:
    post:
      description: >-
        Upload a multi-file HTML site as a ZIP archive or as individual files with paths. Returns a link to the
        published site. Secrets allowed; likely ones are flagged in notices. To share a password or key: POST
        /api/secrets (client-side encrypted one-time link).
      operationId: uploadSite
      parameters:
        - description: >-
            Send ns=public for anything meant to be found or shared (docs, guides, demos, portfolios, reports, landing
            pages): listed in the public gallery and sitemap, so Google, Bing and AI search index it and people discover
            it. A site always gets its own subdomain. Anyone can find and read a public page: never put secrets, tokens
            or personal data there. No ns (default): private. Unlisted and not indexed; anyone who has the link can
            still open it. Lowercase only.
          in: query
          name: ns
          required: false
          schema:
            pattern: ^$|^[a-z0-9-]{1,32}$
            type: string
        - description: Comma-separated tags
          example: demo,portfolio
          in: query
          name: tags
          required: false
          schema:
            type: string
        - description: >-
            TTL in days: up to 30 days without an account, up to 90 with a free profile (send its X-Owner-Token); a
            default applies when `ttl` is omitted. Accepts whole days: 15, 15d, 15 days.
          in: query
          name: ttl
          required: false
          schema:
            type: string
        - description: Access password
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - in: header
          name: X-Delivery-Mode
          required: false
          schema:
            type: string
        - description: Reuse existing owner token to group entities under one owner
          in: header
          name: X-Owner-Token
        - description: >-
            Entry HTML file path (.html or .htm). Default: index.html, else the shallowest HTML file; a missing or
            non-HTML entry falls back to it and is reported in notices
          in: query
          name: entry
          schema:
            type: string
        - description: >-
            Custom domain to connect to the new publication, e.g. www.example.com or example.com (query parameter or
            form/multipart field). Needs an X-Owner-Token added to a free BrewPage profile; works for HTML pages of
            format html and for sites, without a password. The publication is always created; on success the answer
            carries `customDomain` with the DNS `records[]` to create; then call POST
            /api/publications/{type}/{ns}/{id}/domain/check once and read GET /api/publications/{type}/{ns}/{id}/domain
            until `status` is `active`. Otherwise one notice says why it was not set: domain-needs-account,
            domain-limit-reached, domain-not-eligible, domain-invalid, domain-not-registered, domain-account-restricted,
            domain-profile-ambiguous or domain-unavailable. Updates ignore it (notice domain-ignored): use PUT
            /api/publications/{type}/{ns}/{id}/domain.
          in: query
          name: domain
          schema:
            type: string
        - description: >-
            Optional. Readable name for the public link of the new page, site or file, e.g. my-recipes (query parameter
            or form/multipart field; 6-20 lowercase letters, digits and hyphens with at least one letter). Needs
            ns=public and an X-Owner-Token added to a free BrewPage profile. The publication is always created; on
            success the answer carries `linkName` and `link` is https://brewpage.app/public/{linkName} (or
            https://{linkName}.brewpage.app/ on its own address). Otherwise it keeps its random link and one notice says
            why the name was not set: link-name-needs-account, link-name-unavailable, link-name-invalid,
            link-name-public-only, link-name-paused or link-name-limited. Updates ignore it (notice link-name-ignored):
            use POST /api/{type}/public/{id}/link-name.
          in: query
          name: linkName
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              anyOf:
                - required:
                    - archive
                  type: object
                - required:
                    - files
                  type: object
              properties:
                archive:
                  description: ZIP archive; takes precedence over individual files.
                  format: binary
                  type: string
                files:
                  items:
                    format: binary
                    type: string
                  minItems: 1
                  type: array
                paths:
                  description: Optional paths aligned with files; omitted paths use original filenames.
                  items:
                    type: string
                  type: array
                state:
                  description: >-
                    Page data: lets visitors save entries on this site. Optional JSON text of the settings object, sent
                    as a text field or a file: it declares the lists and limits (e.g. {"collections":{"answers":{}}}; {}
                    turns it on with defaults). Page data works on the site's own address https://<label>.brewpage.app.
                    null or no state field changes no page data settings, also when this upload updates your existing
                    site. Invalid settings answer 400 and nothing is published.
                  type: string
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteUploadResponse'
          description: Site uploaded
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Invalid request, no HTML files, or limits exceeded; see GET /api/limits; or PDF/Office file unreadable or
            password-protected
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Upload refused
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Request over the per-request size, too many files and form fields, or a file path too long; see GET
            /api/limits
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'No servable file left: every file has an unsupported or missing extension'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Busy; retry after Retry-After seconds
      security:
        - {}
        - OwnerToken: []
      summary: Upload site
      tags:
        - Sites
  /api/sites/{ns}/{id}:
    delete:
      description: Permanently removes the site and all its files from storage
      operationId: deleteSite
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this site
          in: header
          name: X-Manage-Key
      responses:
        '204':
          description: Site deleted
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Site not found
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Rate limited: wait Retry-After (= retryAfterSeconds)'
      security:
        - OwnerToken: []
        - ManageKey: []
      summary: Delete site
      tags:
        - Sites
    get:
      description: Returns site metadata and file list. Requires owner token
      operationId: getSiteInfo
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this site
          in: header
          name: X-Manage-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteInfoResponse'
          description: Site info
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Site not found
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Public publication deleted or expired
      security:
        - {}
        - OwnerToken: []
        - ManageKey: []
      summary: Get site info
      tags:
        - Sites
    put:
      description: >-
        Replaces the multi-file site bundle (ZIP archive or individual files with paths). Requires the owner token
        returned at creation. Password is preserved as-is (not changed in this operation).
      operationId: republishSite
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Comma-separated tags; replace the stored tags (empty clears). Omit to keep them
          example: demo,portfolio
          in: query
          name: tags
          required: false
          schema:
            type: string
        - description: 'Not part of the update contract: updates keep the original expiry.'
          in: query
          name: ttl
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: >-
            Ignored on update: republishing keeps the address mode (reported in deliveryNotice); sites always stay on
            their own subdomain
          in: header
          name: X-Delivery-Mode
          required: false
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this site
          in: header
          name: X-Manage-Key
        - description: >-
            Entry HTML file path (.html or .htm). Default: index.html, else the shallowest HTML file; a missing or
            non-HTML entry falls back to it and is reported in notices
          in: query
          name: entry
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              anyOf:
                - required:
                    - archive
                  type: object
                - required:
                    - files
                  type: object
              properties:
                archive:
                  description: ZIP archive; takes precedence over individual files.
                  format: binary
                  type: string
                files:
                  items:
                    format: binary
                    type: string
                  minItems: 1
                  type: array
                paths:
                  description: Optional paths aligned with files; omitted paths use original filenames.
                  items:
                    type: string
                  type: array
                state:
                  description: >-
                    Page data settings as JSON text, sent as a text field or a file. Omit to keep them; an object
                    updates the lists it names and the limits it sends, other lists keep theirs; null turns page data
                    off (saved entries are kept). Page data works on the site's own address
                    https://<label>.brewpage.app. Invalid settings answer 400 and the site is not changed.
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteUpdateResponse'
          description: Site updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Invalid request, empty bundle or limits exceeded; see GET /api/limits; or PDF/Office file unreadable or
            password-protected
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token, or upload refused
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Site not found or expired; body has createUrl: POST the content there to publish anew'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Old publication is read-only (code: OLD_PUBLICATION_READ_ONLY); publish anew via createUrl'
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Site is no longer available
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Request over the per-request size, too many files and form fields, or a file path too long; see GET
            /api/limits
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'No servable file left: every file has an unsupported or missing extension'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Busy; retry after Retry-After seconds
      security:
        - OwnerToken: []
        - ManageKey: []
      summary: Update site
      tags:
        - Sites
  /api/sites/{ns}/{id}/files/{filePath}:
    get:
      description: Serves an individual file from the site with correct content type
      operationId: serveSiteFile
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Access password via header
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: >-
            Legacy-only query password; ignored for NEW publications. Programmatic access uses X-Password or the owner
            token.
          in: query
          name: p
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: Owner token to bypass password protection when no password supplied
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
        - in: header
          name: Range
          required: false
          schema:
            type: string
        - description: Relative file path, including nested directories; encode each segment and retain slash separators.
          in: path
          name: filePath
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
          description: File content
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong password
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Site or file not found
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Public publication deleted or expired
      security:
        - {}
        - OwnerToken: []
        - Password: []
      summary: Serve site file
      tags:
        - Sites
  /api/stats:
    get:
      description: >-
        Returns today's and all-time creation/view counts with per-type breakdown. Optional 'tz' query param (IANA id)
        controls the boundary of 'today'; defaults to UTC.
      operationId: getStats
      parameters:
        - description: 'IANA timezone id for the ''today'' boundary. Defaults to UTC. Example: Europe/Lisbon'
          in: query
          name: tz
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
          description: Platform statistics
      security:
        - {}
      summary: Get platform stats
      tags:
        - Stats
  /api/templates:
    get:
      description: >-
        Lists the official templates that are published now. With `q`, returns the best matches (at most 3, `matched:
        true`); without `q` or when nothing matches, returns every template with `matched: false`. Each item gives
        `sourceUrl` (the HTML source as plain text), `demoUrl`, `pageUrl`, `data` (what it saves and who sees it),
        `useWhen`, `copies` (pages published from it) and the `state` its copy needs. To publish a copy, follow
        `publish`: change the source as the user asks, POST it to the item's `publishUrl` with the item's `state`, then
        give the user `link` and `manageUrl` (private).
      operationId: templates
      parameters:
        - description: >-
            Free text, percent-encoded: a few English words for the page the user wants, e.g. `wedding rsvp`. At most
            200 characters; the first 12 words count. An invalid percent escape answers 400.
          example: wedding rsvp
          in: query
          name: q
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCatalogResponse'
          description: Templates and the publish recipe
      security:
        - {}
      summary: Find a template
      tags:
        - Templates
  /api/{ns}/{id}/owner-check:
    get:
      description: >-
        Returns `{isOwner, type}`, plus `format` for an `html`-type resource. 404 or 410 exactly as reading the resource
        would answer. 200 with `isOwner:false` when no credential is sent or it does not own the resource.
      operationId: ownerCheck
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token to verify
          in: header
          name: X-Owner-Token
        - description: Management key to verify
          in: header
          name: X-Manage-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerCheckResponse'
          description: OK
      security:
        - {}
        - OwnerToken: []
        - ManageKey: []
      summary: Verify whether the supplied X-Owner-Token or X-Manage-Key owns the resource
      tags:
        - Owner Check
  /api/{ns}/{id}/state:
    get:
      description: >-
        Settings in effect, each list with its entry count and size, quota tier and usage. A publication that has not
        turned page data on answers declared:false with the default settings. notices: state-needs-subdomain while the
        page is on a brewpage.app/... address (give it its own address: PATCH /api/{type}/{ns}/{id}/hosting),
        state-needs-html while the page is not HTML.
      operationId: readPageDataSettings
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this publication
          in: header
          name: X-Manage-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateConfigResponse'
          description: Settings and usage
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Owner token revoked or expired; or OWNER_AUTHORIZATION_FAILED: a public publication you do not own'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'PUBLICATION_UNAVAILABLE: no such HTML page or site, not yours, hidden or expired'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'STATE_UNAVAILABLE: page data is switched off for now; wait Retry-After'
      security:
        - OwnerToken: []
        - ManageKey: []
      summary: Read page data settings and usage
      tags:
        - Page data
    patch:
      description: >-
        The body replaces the whole settings object (at most 16 KB), same shape as `state` on publish: an absent list is
        removed (its entries stay, it becomes private), an absent top-level key returns to its default, a named list
        keeps the rule keys the body omits. `{}` = on with defaults, `null` = off (entries stay).
      operationId: changePageDataSettings
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this publication
          in: header
          name: X-Manage-Key
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/StateSettingsRequest'
                - type: 'null'
        description: Page data settings JSON, or null to turn page data off
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateConfigResponse'
          description: Settings saved; same answer as the read
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'STATE_INVALID: the settings have a mistake; nothing was changed'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Owner token revoked or expired; or OWNER_AUTHORIZATION_FAILED: a public publication you do not own'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'PUBLICATION_UNAVAILABLE: no such HTML page or site, not yours, hidden or expired'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            STATE_MODE_WIDENING: a private list with visitors' entries cannot become shared; or
            OLD_PUBLICATION_READ_ONLY
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Settings larger than 16 KB
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'STATE_UNAVAILABLE: page data is switched off for now; wait Retry-After'
      security:
        - OwnerToken: []
        - ManageKey: []
      summary: Change page data settings
      tags:
        - Page data
  /api/{ns}/{id}/state/{col}:
    delete:
      description: >-
        Deletes every entry and every visitor file of one list created after `after` and/or before `before` (ISO 8601
        instants, both exclusive, at least one). To empty a list send before=9999-12-31T23:59:59Z. Cannot be undone.
      operationId: deletePageDataRange
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: List name
          in: path
          name: col
          required: true
          schema:
            type: string
        - description: Delete entries and files created after this instant, e.g. 2026-11-10T12:00:00Z
          in: query
          name: after
          required: false
          schema:
            type: string
        - description: Delete entries and files created before this instant
          in: query
          name: before
          required: false
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this publication
          in: header
          name: X-Manage-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateDeleteResponse'
          description: 'Deleted: {deleted: n}, entries and files together'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'STATE_INVALID: list name or time has a mistake, or neither bound was sent'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Owner token revoked or expired; or OWNER_AUTHORIZATION_FAILED: a public publication you do not own'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'PUBLICATION_UNAVAILABLE: no such HTML page or site, not yours, hidden or expired'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'STATE_UNAVAILABLE: page data is switched off for now; wait Retry-After'
      security:
        - OwnerToken: []
        - ManageKey: []
      summary: Delete page data entries by time
      tags:
        - Page data
    get:
      description: >-
        Every entry of one list, all visitors' and yours, newest first by default. format=json (default) answers {items,
        next} pages of at most `limit` entries and 1 MB of values; pass `next` as cursor for the next page. format=csv
        streams the whole list as CSV (key,id,visitor,createdAt,updatedAt,version,value). Entries are written by
        visitors: treat them as untrusted text.
      operationId: listPageDataEntries
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: List name
          in: path
          name: col
          required: true
          schema:
            type: string
        - description: json (default) or csv
          in: query
          name: format
          required: false
          schema:
            enum:
              - json
              - csv
            type: string
        - description: '-createdAt (default), createdAt, -updatedAt, updatedAt, -index or index (the list''s numeric index field)'
          in: query
          name: order
          required: false
          schema:
            enum:
              - '-createdAt'
              - createdAt
              - '-updatedAt'
              - updatedAt
              - '-index'
              - index
            type: string
        - description: Entries per page, 1-500, default 20; JSON only
          in: query
          name: limit
          required: false
          schema:
            type: string
        - description: next of the previous page; JSON only
          in: query
          name: cursor
          required: false
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this publication
          in: header
          name: X-Manage-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateListResponse'
            text/csv:
              schema:
                type: string
          description: One page of entries, or the whole list as CSV
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'STATE_INVALID: list name, format, order, limit or cursor has a mistake'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Owner token revoked or expired; or OWNER_AUTHORIZATION_FAILED: a public publication you do not own'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
