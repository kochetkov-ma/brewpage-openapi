          type: array
        ownerToken:
          description: 'Owner token: keep it; send it as X-Owner-Token on later creates and owner routes'
          type: string
        ref:
          description: 10-character owner handle of the owner routes; it can't open the secret
          type: string
        tags:
          description: Your tags; absent when none
          items:
            type: string
          type: array
        title:
          description: Title the recipient sees
          type: string
      required:
