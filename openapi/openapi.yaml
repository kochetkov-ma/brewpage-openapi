        the BrewPage link keeps working. 204 also when none is set.
      operationId: removePublicationDomain
      parameters:
        - description: html (pages of format html) or site; only these take a custom domain
          in: path
          name: type
          required: true
          schema:
            enum:
              - html
              - site
            type: string
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: >-
            Owner token in a free BrewPage profile: the publication's own token added to the profile, or a profile token
            that reaches the publication
          in: header
          name: X-Owner-Token
          required: true
      responses:
        '204':
          description: Removed, or none was set
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            OWNER_AUTHORIZATION_FAILED: wrong token; OWNER_TOKEN_REVOKED or OWNER_TOKEN_EXPIRED; DOMAIN_NEEDS_ACCOUNT:
            custom domains need a free BrewPage account; sign in at account.brewpage.app and add this token to your
            profile; ACCOUNT_RESTRICTED or ACCOUNT_BLOCKED: this account cannot add domains now
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            PUBLICATION_UNAVAILABLE: missing or expired publication (outside public also for a wrong token);
            FEATURE_DISABLED: custom domains are not available right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_SUSPENDED: this domain is suspended; DOMAIN_PROFILE_AMBIGUOUS: the token is in several profiles; use
            a profile's admin token
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Rate limited: wait Retry-After (= retryAfterSeconds)'
      security:
        - OwnerToken: []
      summary: Remove this publication's custom domain
      tags:
        - Custom Domains
