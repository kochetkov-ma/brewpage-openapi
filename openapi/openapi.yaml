        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            LINK_NAME_NEEDS_ACCOUNT: link names need a free BrewPage profile: sign in at
            https://account.brewpage.app/tokens, press Add existing token and paste this owner token, then set the link
            name again; OWNER_AUTHORIZATION_FAILED, OWNER_TOKEN_REVOKED or OWNER_TOKEN_EXPIRED
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            PUBLICATION_UNAVAILABLE: missing or expired publication; FEATURE_DISABLED: link names are not available
            right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            LINK_NAME_UNAVAILABLE: this link name is not available; LINK_NAME_PUBLIC_ONLY: only public publications can
            have a link name: make it public first (POST /api/{type}/{ns}/{id}/public), then set the name on the new id;
            LINK_NAME_LIMIT: this publication can't take another link name (`used`, `limit`); OLD_PUBLICATION_READ_ONLY;
            PUBLICATION_CHANGED: try again
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); or LINK_NAME_LIMITED: try again later (Retry-After);
            or LINK_NAME_PAUSED: too many tries, wait Retry-After seconds (`level` 1-4)
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'HOSTING_CREATION_PAUSED: address changes are briefly unavailable; retry after Retry-After'
