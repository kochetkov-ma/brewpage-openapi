    put:
      description: >-
        Replaces the multi-file site bundle (ZIP archive or individual files with paths). Requires the owner token
        returned at creation. Password is preserved as-is (not changed in this operation).
      operationId: republishSite
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Comma-separated tags; replace the stored tags (empty clears). Omit to keep them
          example: demo,portfolio
          in: query
          name: tags
          required: false
          schema:
            type: string
        - description: 'Ignored: updates keep the original expiry; a supplied value is reported in notices (ttl-ignored).'
          in: query
          name: ttl
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: >-
            Ignored on update: republishing keeps the address mode (reported in deliveryNotice); sites always stay on
            their own subdomain
          in: header
          name: X-Delivery-Mode
          required: false
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this site
          in: header
          name: X-Manage-Key
        - description: >-
            Entry HTML file path (.html or .htm). Default: index.html, else the shallowest HTML file; a missing or
            non-HTML entry falls back to it and is reported in notices
          in: query
          name: entry
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              anyOf:
                - required:
                    - archive
                  type: object
                - required:
                    - files
                  type: object
              properties:
                archive:
                  description: ZIP archive; takes precedence over individual files.
                  format: binary
                  type: string
                files:
                  items:
                    format: binary
                    type: string
                  minItems: 1
                  type: array
                paths:
                  description: Optional paths aligned with files; omitted paths use original filenames.
                  items:
                    type: string
                  type: array
                state:
                  description: >-
                    Page data settings as JSON text, sent as a text field or a file. Omit to keep them; an object
                    updates the lists it names and the limits it sends, other lists keep theirs; null turns page data
                    off (saved entries are kept). Each visitor reads and writes only their own entries unless a list is
                    shared; you, the author, read them all. Page data works on the site's own address
                    https://<label>.brewpage.app. Invalid settings answer 400 and the site is not changed.
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteUpdateResponse'
          description: Site updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Invalid request, empty bundle or limits exceeded; see GET /api/limits; or PDF/Office file unreadable or
            password-protected
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token, or upload refused
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Site not found or expired; body has createUrl: POST the content there to publish anew'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Old publication is read-only (code: OLD_PUBLICATION_READ_ONLY); publish anew via createUrl'
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Site is no longer available
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Request over the per-request size, too many files and form fields, or a file path too long; see GET
            /api/limits
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'No servable file left: every file has an unsupported or missing extension'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Busy; retry after Retry-After seconds
      security:
        - OwnerToken: []
        - ManageKey: []
