        see /llms-full.txt. Secrets allowed; likely ones are flagged in notices. For a secret: private namespace +
        password.
      operationId: create_1
      parameters:
        - description: >-
            Send ns=public for anything meant to be found or shared (docs, guides, demos, portfolios, reports, landing
            pages): listed in the public gallery and sitemap, so Google, Bing and AI search index it and people discover
            it. Public pages are served on the brewpage.app domain itself, for the strongest search reach; code that
            needs its own origin (cookies, storage) gets its own subdomain automatically. Anyone can find and read a
            public page: never put secrets, tokens or personal data there. No ns (default): private. Unlisted and not
            indexed; anyone who has the link can still open it. Lowercase only.
