          description: 'Old publication is read-only (code: OLD_PUBLICATION_READ_ONLY); publish anew via createUrl'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Busy; retry after Retry-After seconds
      security:
        - OwnerToken: []
        - ManageKey: []
      summary: Rename an html page or site (profile owners); empty title restores the one from the content
      tags:
        - Hosting Management
  /api/{type}/{ns}/{id}/visibility:
    post:
      operationId: setVisibility
      parameters:
        - in: path
          name: type
          required: true
          schema:
            enum:
              - html
              - files
              - json
              - kv
              - sites
            type: string
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this publication
          in: header
          name: X-Manage-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisibilityRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisibilityResponse'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token or management key; token revoked or expired
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Publication unavailable (outside public also for wrong credentials)
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
      security:
        - OwnerToken: []
        - ManageKey: []
      summary: Hide or show a public publication in gallery & search. Link unchanged
      tags:
        - Hosting Management
  /galleries:
    get:
      description: >-
        Renders a minimal, bot-friendly anchor index of every current public site, page, image and video, paginated with
        rel=prev/next. Sorted by popularity (top 50 by views) then by recency. Underlying data is cached for ~2h.
      operationId: galleries
      parameters:
        - description: 1-based page number; omitted = page 1
          in: query
          name: page
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: string
          description: HTML index page
        '404':
          description: Page number invalid or past the last page
      security:
        - {}
      summary: Flat HTML index of all current public publications
      tags:
        - SEO
  /preview-html/{ns}/{id}:
    get:
      description: Tiny HTML response with og:title/og:description/og:image meta tags for social-bot unfurls
      operationId: previewHtml
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: HTML stub with OG meta (or generic stub when resource is missing)
      security:
        - {}
      summary: OpenGraph HTML stub
      tags:
        - preview
  /preview/{ns}/{id}.jpg:
    get:
      description: >-
        Canonical og:image URL. Returns the 1200×630 JPEG card, cached, with ETag/If-None-Match support; non-public
        namespaces and protected content add X-Robots-Tag: noindex; falls back to /og-image.png?v=3 on any failure
      operationId: previewJpeg
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                format: binary
                type: string
            image/png:
              schema:
                format: binary
                type: string
          description: Image bytes
        '302':
          description: Fallback to static og-image.png (flag off, no source, render gate busy, error)
        '304':
          description: Not modified (If-None-Match matched current ETag)
        '429':
          description: Per-IP rate limit exceeded
      security:
        - {}
      summary: Per-content OG image
      tags:
        - preview
  /preview/{ns}/{id}.png:
    get:
      description: >-
        Legacy alias of /preview/{ns}/{id}.jpg for links shared earlier: serves the same JPEG card with identical bytes,
        headers and fallbacks
      operationId: preview
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                format: binary
                type: string
            image/png:
              schema:
                format: binary
                type: string
          description: Image bytes
        '302':
          description: Fallback to static og-image.png (flag off, no source, render gate busy, error)
        '304':
          description: Not modified (If-None-Match matched current ETag)
        '429':
          description: Per-IP rate limit exceeded
      security:
        - {}
      summary: Per-content OG image (legacy URL)
      tags:
        - preview
  /preview/{ns}/{id}/{variant}.webp:
    get:
      description: thumb-d 800x373, thumb-m 320x149, full (page top, else the 1200 px card); same gates as the card
      operationId: previewWebp
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            enum:
              - thumb-d
              - thumb-m
              - full
            type: string
        - description: Version from a server-built URL
          in: query
          name: v
          required: false
          schema:
            type: string
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            image/webp:
              schema:
                format: binary
                type: string
          description: WebP bytes
        '304':
          description: Not modified
        '404':
          description: No preview
        '429':
          description: Per-IP rate limit exceeded
      security:
        - {}
      summary: WebP preview
      tags:
        - preview
  /{key}.txt:
    get:
      description: Serves the IndexNow verification key file for search engine crawlers
      operationId: serveKeyFile
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: Key file content
        '404':
          description: Unknown key
      security:
        - {}
      summary: IndexNow key verification
      tags:
        - SEO
  /{ns}/{id}:
    get:
      description: >-
        Serves the publication behind the link: page, site, file, JSON or KV. 410 for a deleted public publication;
        otherwise 404.
      operationId: resolve
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Access password for protected resources
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: >-
            Legacy-only query password; ignored for NEW publications. Programmatic access uses X-Password or the owner
            token.
          in: query
          name: p
          required: false
          schema:
            type: string
        - description: Force download as attachment
          in: query
          name: dl
          required: false
          schema:
            type: boolean
        - description: 'Bypass SPA: stream raw bytes directly (used by <video src>, <iframe src> for PDF, embed cases)'
          in: query
          name: raw
          required: false
          schema:
            type: boolean
        - description: Legacy site wrapper bypass; NEW publications retain stored hosting and protection policies
          in: query
          name: inline
          required: false
          schema:
            type: boolean
        - in: header
          name: Range
          required: false
          schema:
            type: string
        - in: header
          name: X-Resolve
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - in: header
          name: Accept
          required: false
          schema:
            type: string
        - description: 'Owner token; when supplied, response carries X-Is-Owner: true on match'
          in: header
          name: X-Owner-Token
          schema:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
          description: OK
      security:
        - {}
        - OwnerToken: []
        - Password: []
      summary: Open short link
      tags:
        - Short Links
  /{ns}/{id}/{sub}:
    get:
      description: Serves a site file or KV value under the link. Any miss is 404.
      operationId: resolveWithSub
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: sub
          required: true
          schema:
            type: string
        - description: Access password for protected resources
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: >-
            Legacy-only query password; ignored for NEW publications. Programmatic access uses X-Password or the owner
            token.
          in: query
          name: p
          required: false
          schema:
            type: string
        - description: Force download as attachment
          in: query
          name: dl
          required: false
          schema:
            type: boolean
        - in: header
          name: Range
          required: false
          schema:
            type: string
        - in: header
          name: X-Resolve
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: 'Owner token; when supplied, response carries X-Is-Owner: true on match'
          in: header
          name: X-Owner-Token
          schema:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
          description: OK
      security:
        - {}
        - OwnerToken: []
        - Password: []
      summary: Open short-link sub-path
      tags:
        - Short Links
servers:
  - url: https://brewpage.app
tags:
  - description: Key-Value store with up to 1000 keys per store
    name: KV
  - description: Get a new owner token (stateless); with an admin token, manage profile tokens.
    name: Owner Token
  - description: >-
      Browse public content from the 'public' namespace without password protection; mine=true lists the caller's own
      publications
    name: Gallery
  - description: Short URL resolver for sharing
    name: Short Links
  - description: Lightweight owner-token probe; never increments views or returns content
    name: Owner Check
  - description: HTML page hosting with markdown support
    name: HTML
  - description: 'User-facing upload limits: one source for the UI, agents and docs'
    name: Limits
  - description: Multi-file HTML site hosting via ZIP or folder upload
    name: Sites
  - description: Owner list and stats
    name: Publications
  - description: >-
      Serve an HTML page or a site on your own domain, free with a BrewPage profile. Set the hostname, create the DNS
      records the answer lists, call check until the status is active.
    name: Custom Domains
  - description: >-
      Social previews: per-content OpenGraph image (1200×630 JPEG; .png is a legacy URL alias) and OG meta stub for
      social bots
    name: preview
  - description: Search engine optimization endpoints
    name: SEO
  - description: JSON document store with up to 10,000 docs per collection
    name: JSON
  - description: Platform-wide usage statistics
    name: Stats
  - description: Fresh, collision-free namespace suggestions
    name: Namespace
  - description: File hosting up to 5 MB per file (video 20 MB), 1000 files per namespace
    name: Files
  - description: Owner-only publication delivery settings
    name: Hosting Management
  - description: >-
      What visitors saved on your HTML page or site: settings, entries, CSV export, author entries, deletes. Visitors
      save through the page itself, not through this API: the page loads https://brewpage.app/js/state.js and calls
      bp.state(), which uses the host API /_bp/state/v1 on the page's own address (https://<label>.brewpage.app); that
      host API serves only its own page, so it is not listed here. Turn page data on with `state` when you publish, or
      with PATCH /api/{ns}/{id}/state. By default each visitor reads and writes only their own entries; you read them
      all.
    name: Page data
  - description: Abuse reports for hosted content
    name: Reports
