        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_NOT_FOUND: no custom domain on this publication; PUBLICATION_UNAVAILABLE: missing or expired
            publication (outside public also for a wrong token); FEATURE_DISABLED: custom domains are not available
            right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_SUSPENDED: this domain is suspended; DOMAIN_PROFILE_AMBIGUOUS: the token is in several profiles; use
