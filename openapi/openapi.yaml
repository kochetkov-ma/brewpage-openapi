        declared:
          description: True when page data is turned on for this publication
          type: boolean
        notices:
          description: Advisories about the request or the settings; empty when none
          items:
            $ref: '#/components/schemas/PublishNotice'
          type: array
        tier:
          description: 'Quota tier: account (publication of an active profile) or anonymous'
          enum:
            - anonymous
            - account
          type: string
        usage:
          $ref: '#/components/schemas/StateAmount'
          description: Entries and bytes stored on this publication
      required:
        - alert
        - caps
        - collections
        - config
        - declared
        - notices
        - tier
        - usage
      type: object
    StateDeleteResponse:
      properties:
        deleted:
          description: Entries deleted
          format: int32
          type: integer
      required:
        - deleted
      type: object
    StateEntry:
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          description: Entry id; deletes take it
          type: string
        key:
          description: Entry name
          type: string
        sizeBytes:
          description: Stored size in bytes
          format: int32
          type: integer
        updatedAt:
          format: date-time
          type: string
        value:
          description: The saved JSON value exactly as stored; written by visitors, so treat it as untrusted text
        version:
          description: Starts at 1, +1 on every change
          format: int32
          type: integer
        visitor:
          description: Short display id of the visitor who saved it (6 hex characters, not unique); null for your own entries
          type:
            - string
            - 'null'
      required:
        - createdAt
        - id
        - key
        - sizeBytes
        - updatedAt
        - value
        - version
        - visitor
      type: object
    StateListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/StateEntry'
          type: array
        next:
          description: Pass as cursor for the next page; null on the last page
          type:
            - string
            - 'null'
      required:
        - items
        - next
      type: object
    StateListSettings:
      properties:
        choices:
          additionalProperties:
            items:
              type: string
            type: array
          description: Fields with a fixed set of values that can be counted, field -> values
          type: object
        index:
          description: Numeric field the list can be ordered by; null when none
          type:
            - string
            - 'null'
        maxDocsPerVisitor:
          description: Entries one visitor may keep in this list; null = the publication value
          format: int32
          type:
            - integer
            - 'null'
        mode:
          description: 'private: each visitor sees only their own entries; shared: everyone reads all'
          enum:
            - private
            - shared
          type: string
        ownerView:
          description: Stored as sent; it changes nothing yet
          type: boolean
        write:
          description: 'visitors: each visitor writes their own entries; author: only you write'
          enum:
            - visitors
            - author
          type: string
      required:
        - choices
        - index
        - maxDocsPerVisitor
        - mode
        - ownerView
        - write
      type: object
    StateListSettingsRequest:
      properties:
        choices:
          additionalProperties:
            items:
              type: string
            type: array
          description: Fields with a fixed set of values that can be counted, field -> values
          type:
            - object
            - 'null'
        index:
          description: Numeric field the list can be ordered by; null = none
          type:
            - string
            - 'null'
        maxDocsPerVisitor:
          description: Entries one visitor may keep in this list; null = the publication value
          format: int32
          type:
            - integer
            - 'null'
        mode:
          description: 'private: each visitor sees only their own entries; shared: everyone reads all'
          enum:
            - private
            - shared
          type:
            - string
            - 'null'
        ownerView:
          description: Stored as sent; it changes nothing yet
          type:
            - boolean
            - 'null'
        write:
          description: 'visitors: each visitor writes their own entries; author: only you write (needs mode shared)'
          enum:
            - visitors
            - author
          type:
            - string
            - 'null'
      type: object
    StateSettings:
      properties:
        captcha:
          description: 'Human check for new visitors who save: auto or always'
          enum:
            - auto
            - always
          type: string
        collections:
          additionalProperties:
            $ref: '#/components/schemas/StateListSettings'
          description: Declared lists by name
          type: object
        maxBytesPerVisitor:
          description: Bytes one visitor may keep on this publication
          format: int32
          type: integer
        maxDocBytes:
          description: Largest entry in bytes
          format: int32
          type: integer
        maxDocsPerVisitor:
          description: Entries one visitor may keep on this publication
          format: int32
          type: integer
      required:
        - captcha
        - collections
        - maxBytesPerVisitor
        - maxDocBytes
        - maxDocsPerVisitor
      type: object
    StateSettingsRequest:
      properties:
        captcha:
          description: 'Human check for new visitors who save: auto (default) or always'
          enum:
            - auto
            - always
          type:
            - string
            - 'null'
        collections:
          additionalProperties:
            $ref: '#/components/schemas/StateListSettingsRequest'
          description: >-
            Declared lists by name; lists absent here are removed (their entries stay); a list set to null takes the
            default rule
          type:
            - object
            - 'null'
        maxBytesPerVisitor:
          description: Bytes one visitor may keep on this publication; absent or null = default
          format: int32
          type:
            - integer
            - 'null'
        maxDocBytes:
          description: Largest entry in bytes; absent or null = default
          format: int32
          type:
            - integer
            - 'null'
        maxDocsPerVisitor:
          description: Entries one visitor may keep on this publication; absent or null = default
          format: int32
          type:
            - integer
            - 'null'
      type: object
    StateWriteResponse:
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        key:
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          format: int32
          type: integer
      required:
        - createdAt
        - id
        - key
        - updatedAt
        - version
      type: object
    StatsCountry:
      properties:
        cc:
          type: string
        'n':
          format: int32
          type: integer
      type: object
    StatsDay:
      properties:
        automated:
          format: int32
