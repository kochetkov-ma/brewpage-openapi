                $ref: '#/components/schemas/ErrorResponse'
          description: Store or key not found
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Rate limited: wait Retry-After (= retryAfterSeconds)'
