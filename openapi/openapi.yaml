  /api/kv:
    get:
      description: Returns all KV stores owned by the given token in the namespace. Returns empty list without token
      operationId: listStores
      parameters:
        - description: 'Namespace. Omitted: private. `public` = gallery & search. Lowercase only.'
          in: query
          name: ns
          required: false
          schema:
            pattern: ^$|^[a-z0-9-]{1,32}$
            type: string
        - description: Owner token to filter by ownership. Without token returns empty list
          in: header
          name: X-Owner-Token
      responses:
        '200':
          content:
            application/json:
