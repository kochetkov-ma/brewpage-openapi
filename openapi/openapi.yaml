            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Busy; retry after Retry-After seconds
      security:
        - {}
        - OwnerToken: []
      summary: Create HTML page
      tags:
        - HTML
