          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: The custom domain
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            OWNER_AUTHORIZATION_FAILED: wrong token; OWNER_TOKEN_REVOKED or OWNER_TOKEN_EXPIRED; DOMAIN_NEEDS_ACCOUNT:
            custom domains need a free BrewPage account; sign in at account.brewpage.app and add this token to your
            profile
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_NOT_FOUND: no custom domain on this publication; PUBLICATION_UNAVAILABLE: missing or expired
            publication (outside public also for a wrong token); FEATURE_DISABLED: custom domains are not available
            right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'DOMAIN_PROFILE_AMBIGUOUS: the token is in several profiles; use a profile''s admin token'
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Publication unavailable; owner credentials valid
      security:
        - OwnerToken: []
      summary: Custom domain of this publication
      tags:
        - Custom Domains
    put:
      description: >-
        Connects a hostname you own (www.example.com or example.com) to this HTML page or site: adds it to your profile,
        or moves it here when your profile already holds it. Works for HTML pages of format html and for sites, without
        a password; a page on a BrewPage path address moves to its own subdomain (`deliveryModeChanged`), and its
        BrewPage link keeps working. A hostname that was on this publication before stays in your profile, unattached
        (`detached`). Next: create exactly the DNS records in `records[]` at your DNS provider, call POST
        /api/publications/{type}/{ns}/{id}/domain/check, and repeat until `status` is `active` (`serving` true, `url`
        set).
      operationId: setPublicationDomain
      parameters:
        - description: html (pages of format html) or site; only these take a custom domain
