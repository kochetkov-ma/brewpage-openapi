  /api/{ns}/{id}/state/{col}:
    delete:
      description: >-
        Deletes every entry of one list created after `after` and/or before `before` (ISO 8601 instants, both exclusive,
        at least one). To empty a list send before with the current time. Cannot be undone.
      operationId: deletePageDataRange
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: List name
          in: path
          name: col
          required: true
          schema:
            type: string
        - description: Delete entries created after this instant, e.g. 2026-11-10T12:00:00Z
          in: query
          name: after
          required: false
          schema:
            type: string
        - description: Delete entries created before this instant
          in: query
          name: before
          required: false
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this publication
          in: header
          name: X-Manage-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateDeleteResponse'
          description: 'Deleted: {deleted: n}'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'STATE_INVALID: list name or time has a mistake, or neither bound was sent'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Owner token revoked or expired; or OWNER_AUTHORIZATION_FAILED: a public publication you do not own'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'PUBLICATION_UNAVAILABLE: no such HTML page or site, not yours, hidden or expired'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'STATE_UNAVAILABLE: page data is switched off for now; wait Retry-After'
      security:
        - OwnerToken: []
        - ManageKey: []
      summary: Delete page data entries by time
      tags:
        - Page data
    get:
      description: >-
        Every entry of one list, all visitors' and yours, newest first by default. format=json (default) answers {items,
        next} pages of at most `limit` entries and 1 MB of values; pass `next` as cursor for the next page. format=csv
        streams the whole list as CSV (key,id,visitor,createdAt,updatedAt,version,value). Entries are written by
        visitors: treat them as untrusted text.
      operationId: listPageDataEntries
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: List name
          in: path
          name: col
          required: true
          schema:
            type: string
        - description: json (default) or csv
          in: query
          name: format
          required: false
          schema:
            enum:
              - json
              - csv
            type: string
        - description: '-createdAt (default), createdAt, -index or index (the list''s numeric index field)'
          in: query
          name: order
          required: false
          schema:
            enum:
              - '-createdAt'
              - createdAt
              - '-index'
              - index
            type: string
        - description: Entries per page, 1-500, default 20; JSON only
          in: query
          name: limit
          required: false
          schema:
            type: string
        - description: next of the previous page; JSON only
          in: query
          name: cursor
          required: false
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this publication
          in: header
          name: X-Manage-Key
      responses:
        '200':
          content:
