            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: File not found or expired
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Public publication deleted or expired
      security:
        - {}
        - OwnerToken: []
        - Password: []
      summary: Download file
      tags:
        - Files
    put:
