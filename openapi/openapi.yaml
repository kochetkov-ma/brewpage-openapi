  /api/html:
    post:
      description: >-
        Stores HTML or markdown content and returns a shareable link. Reuse existing owner token to group entities under
        one owner. Also accepts raw text/* (HTML, Markdown, YAML, XML, CSV, code) and application/octet-stream bodies —
        see /llms-full.txt. Secrets allowed; likely ones are flagged in notices. To share a password or key: POST
        /api/secrets (client-side encrypted one-time link).
      operationId: create_1
      parameters:
        - description: >-
            Send ns=public for anything meant to be found or shared (docs, guides, demos, portfolios, reports, landing
            pages): listed in the public gallery and sitemap, so Google, Bing and AI search index it and people discover
            it. Public pages are served on the brewpage.app domain itself, for the strongest search reach; code that
            needs its own origin (cookies, storage) gets its own subdomain automatically. Anyone can find and read a
            public page: never put secrets, tokens or personal data there. No ns (default): private. Unlisted and not
            indexed; anyone who has the link can still open it. Lowercase only.
          in: query
          name: ns
          required: false
          schema:
            pattern: ^$|^[a-z0-9-]{1,32}$
            type: string
        - description: Comma-separated tags
          example: demo,test
          in: query
          name: tags
          required: false
          schema:
            type: string
        - description: >-
            TTL in days: up to 30 days without an account, up to 90 with a free profile (send its X-Owner-Token); a
            default applies when `ttl` is omitted. Accepts whole days: 15, 15d, 15 days.
          in: query
          name: ttl
          required: false
          schema:
            type: string
        - description: >-
            Content format. 'html' (default) — stored as sent, except a whole page pasted from a chat is repaired (see
            'verbatim'); omitted, source code or JSON is saved as its code format (notice format-detected). 'markdown' /
            'md' — rendered to styled HTML via github-markdown-css. Code/text languages stored and served raw with
            format-specific MIME (text/csv, application/json, text/plain) plus X-Content-Type-Options: nosniff; raw
            reads of xml answer text/plain, downloads keep text/xml: yaml, json, xml, csv, tsv, log, toml, ini, sql, sh,
            bat, env, javascript, typescript, tsx, jsx, css, properties, docker, txt. Decides over a filename extension;
            unknown values are ignored. A whole HTML document sent as 'markdown' is published as an HTML page.
          in: query
          name: format
          required: false
          schema:
            default: html
            type: string
        - description: >-
            Access password. Empty means no password restriction. Protected pages are never listed in the gallery or
            sitemap. OLD links accept ?p=; NEW access uses X-Password or a reader access cookie after password entry.
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: >-
            Store the content exactly as sent. By default a whole HTML page pasted from a chat (wrapped in a code block,
            surrounded by chat text, or entity-escaped) is restored and a notice is returned; 'true' keeps the text as
            is.
          in: query
          name: verbatim
          schema:
            type: boolean
        - description: >-
            Custom domain to connect to the new publication, e.g. www.example.com or example.com (query parameter or
            form/multipart field). Needs an X-Owner-Token added to a free BrewPage profile; works for HTML pages of
            format html and for sites, without a password. The publication is always created; on success the answer
            carries `customDomain` with the DNS `records[]` to create; then call POST
            /api/publications/{type}/{ns}/{id}/domain/check once and read GET /api/publications/{type}/{ns}/{id}/domain
            until `status` is `active`. Otherwise one notice says why it was not set: domain-needs-account,
            domain-limit-reached, domain-not-eligible, domain-invalid, domain-not-registered, domain-account-restricted,
            domain-profile-ambiguous or domain-unavailable. Updates ignore it (notice domain-ignored): use PUT
            /api/publications/{type}/{ns}/{id}/domain.
          in: query
          name: domain
          schema:
            type: string
        - description: >-
            Optional. Readable name for the public link of the new page, site or file, e.g. my-recipes (query parameter
            or form/multipart field; 6-20 lowercase letters, digits and hyphens with at least one letter). Needs
            ns=public and an X-Owner-Token added to a free BrewPage profile. The publication is always created; on
            success the answer carries `linkName` and `link` is https://brewpage.app/public/{linkName} (or
            https://{linkName}.brewpage.app/ on its own address). Otherwise it keeps its random link and one notice says
            why the name was not set: link-name-needs-account, link-name-unavailable, link-name-invalid,
            link-name-public-only, link-name-paused or link-name-limited. Updates ignore it (notice link-name-ignored):
            use POST /api/{type}/public/{id}/link-name.
          in: query
          name: linkName
          schema:
            type: string
        - description: Slug of the official template this page was made from (the `slug` of a `GET /api/templates` item).
          in: query
          name: template
          schema:
            type: string
        - description: Reuse existing owner token to group entities under one owner. If omitted, a new token is generated
          in: header
          name: X-Owner-Token
        - description: >-
            Delivery mode: path or subdomain. Sites and non-public HTML pages are always subdomain. The answer states
            the mode in effect (effectiveDeliveryMode, deliveryNotice). Omit it for the default.
          in: header
          name: X-Delivery-Mode
          required: false
          schema:
            enum:
              - path
              - subdomain
            type: string
      requestBody:
        content:
          application/javascript:
            schema:
              type: string
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlUploadRequest'
          application/octet-stream:
            schema:
              format: binary
              type: string
          application/toml:
            schema:
              type: string
          application/x-yaml:
            schema:
              type: string
          application/xml:
            schema:
              type: string
          application/yaml:
            schema:
              type: string
          text/css:
            schema:
              type: string
          text/csv:
            schema:
              type: string
          text/html:
            schema:
              type: string
          text/javascript:
            schema:
              type: string
          text/markdown:
            schema:
              type: string
          text/plain:
            schema:
              type: string
          text/x-toml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
          text/yaml:
            schema:
              type: string
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlUploadResponse'
          description: Page created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request parameters; or PDF/Office file unreadable or password-protected
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Upload refused
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Busy; retry after Retry-After seconds
      security:
        - {}
        - OwnerToken: []
      summary: Create HTML page
      tags:
        - HTML
