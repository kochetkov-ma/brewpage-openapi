        - description: 'Entry name: 1-128 letters, digits, ''.'', - or _, not starting with _'
          in: path
          name: key
          required: true
          schema:
            type: string
        - description: 'Version last read: 3 or "3"'
          in: header
          name: If-Match
          required: false
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this publication
          in: header
          name: X-Manage-Key
      requestBody:
        content:
