    TitleResponse:
      properties:
        custom:
          description: true = set by the owner and kept on republish; false = taken from the content
          type: boolean
        notices:
          description: Advisories about the request or its result; omitted when none.
          items:
            $ref: '#/components/schemas/PublishNotice'
          type: array
