  /api/publications/{type}/{ns}/{id}/domain:
    delete:
      description: >-
        Removes the custom domain your profile holds on this publication from the profile; the slot is free at once and
        the BrewPage link keeps working. 204 also when none is set.
      operationId: removePublicationDomain
      parameters:
        - description: html (pages of format html) or site; only these take a custom domain
          in: path
          name: type
          required: true
          schema:
            enum:
              - html
              - site
            type: string
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: >-
            Owner token in a free BrewPage profile: the publication's own token added to the profile, or a profile token
            that reaches the publication
          in: header
          name: X-Owner-Token
          required: true
      responses:
        '204':
          description: Removed, or none was set
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            OWNER_AUTHORIZATION_FAILED: wrong token; OWNER_TOKEN_REVOKED or OWNER_TOKEN_EXPIRED; DOMAIN_NEEDS_ACCOUNT:
            custom domains need a free BrewPage profile: sign in at https://account.brewpage.app/tokens, press Add
            existing token and paste this owner token, then set the domain again; ACCOUNT_RESTRICTED or ACCOUNT_BLOCKED:
            this profile cannot add domains now
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            PUBLICATION_UNAVAILABLE: missing or expired publication (outside public also for a wrong token);
            FEATURE_DISABLED: custom domains are not available right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_SUSPENDED: BrewPage suspended this domain; write to info@brewpage.app; DOMAIN_PROFILE_AMBIGUOUS: the
            token is in several profiles; set the domain with a profile token of the profile that should hold it
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Rate limited: wait Retry-After (= retryAfterSeconds)'
      security:
        - OwnerToken: []
      summary: Remove this publication's custom domain
      tags:
        - Custom Domains
    get:
      description: >-
        Reads the custom domain your profile holds on this publication: status, problem and the DNS `records[]` with
        their state from the last check.
      operationId: getPublicationDomain
      parameters:
        - description: html (pages of format html) or site; only these take a custom domain
          in: path
          name: type
          required: true
          schema:
            enum:
              - html
              - site
            type: string
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: >-
            Owner token in a free BrewPage profile: the publication's own token added to the profile, or a profile token
            that reaches the publication
          in: header
          name: X-Owner-Token
          required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: The custom domain
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            OWNER_AUTHORIZATION_FAILED: wrong token; OWNER_TOKEN_REVOKED or OWNER_TOKEN_EXPIRED; DOMAIN_NEEDS_ACCOUNT:
            custom domains need a free BrewPage profile: sign in at https://account.brewpage.app/tokens, press Add
            existing token and paste this owner token, then set the domain again
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_NOT_FOUND: no custom domain on this publication; PUBLICATION_UNAVAILABLE: missing or expired
            publication (outside public also for a wrong token); FEATURE_DISABLED: custom domains are not available
            right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_PROFILE_AMBIGUOUS: the token is in several profiles; set the domain with a profile token of the
            profile that should hold it
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Publication unavailable; owner credentials valid
      security:
        - OwnerToken: []
      summary: Custom domain of this publication
      tags:
        - Custom Domains
    put:
      description: >-
        Connects a hostname you own (www.example.com or example.com) to this HTML page or site: adds it to your profile,
        or moves it here when your profile already holds it. Works for HTML pages of format html and for sites, without
        a password; a page on a BrewPage path address moves to its own subdomain (`deliveryModeChanged`), and its
        BrewPage link keeps working. A hostname that was on this publication before stays in your profile, unattached
        (`detached`). A new hostname whose domain is not registered is refused (400 DOMAIN_NOT_REGISTERED). For an added
        hostname the first automatic DNS check runs about 15 minutes later (`nextCheckAt`). Next: create exactly the DNS
        records in `records[]`, then call POST /api/publications/{type}/{ns}/{id}/domain/check once. BrewPage keeps
        checking on its own (`nextCheckAt`): read GET /api/publications/{type}/{ns}/{id}/domain until `status` is
        `active`; check again only after changing DNS. Every custom-domain object (the domain answers and
        `customDomain`) names its next step in `nextStep`.
      operationId: setPublicationDomain
      parameters:
        - description: html (pages of format html) or site; only these take a custom domain
          in: path
          name: type
          required: true
          schema:
            enum:
              - html
              - site
            type: string
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: >-
            Owner token in a free BrewPage profile: the publication's own token added to the profile, or a profile token
            that reaches the publication
          in: header
          name: X-Owner-Token
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDomainRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: Moved here or already set; same body as 201
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: Added to the profile and set on this publication
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            INVALID_HOSTNAME: not a valid hostname; DOMAIN_NOT_ALLOWED: this hostname cannot be used;
            DOMAIN_NOT_REGISTERED: the domain is not registered yet; register it with a domain registrar first
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            OWNER_AUTHORIZATION_FAILED: wrong token; OWNER_TOKEN_REVOKED or OWNER_TOKEN_EXPIRED; DOMAIN_NEEDS_ACCOUNT:
            custom domains need a free BrewPage profile: sign in at https://account.brewpage.app/tokens, press Add
            existing token and paste this owner token, then set the domain again; ACCOUNT_RESTRICTED or ACCOUNT_BLOCKED:
            this profile cannot add domains now
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            PUBLICATION_UNAVAILABLE: missing or expired publication (outside public also for a wrong token);
            FEATURE_DISABLED: custom domains are not available right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            NOT_ELIGIBLE: the publication cannot take a custom domain (`reason`); DOMAIN_LIMIT: the profile already
            holds all its custom domains (`limit`, `used`); remove or move one; DOMAIN_SUSPENDED: BrewPage suspended
            this domain; write to info@brewpage.app; DOMAIN_PROFILE_AMBIGUOUS: the token is in several profiles; set the
            domain with a profile token of the profile that should hold it
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Rate limited: wait Retry-After (= retryAfterSeconds)'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_INTAKE_PAUSED: adding custom domains is paused; try again later; HOSTING_CREATION_PAUSED: address
            changes are briefly unavailable; retry after Retry-After
      security:
        - OwnerToken: []
      summary: Set a custom domain on this publication
      tags:
        - Custom Domains
  /api/publications/{type}/{ns}/{id}/domain/check:
    post:
      description: >-
        Runs a DNS check now and returns the updated state; call it after creating the records in `records[]`. BrewPage
        also checks on its own (`nextCheckAt`; a pending domain at least about hourly), so this call only speeds it up.
        Checks are spaced: a repeat too soon answers 429 DOMAIN_CHECK_TOO_SOON; wait Retry-After.
      operationId: checkPublicationDomain
      parameters:
        - description: html (pages of format html) or site; only these take a custom domain
          in: path
          name: type
          required: true
          schema:
            enum:
              - html
              - site
            type: string
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: >-
            Owner token in a free BrewPage profile: the publication's own token added to the profile, or a profile token
            that reaches the publication
          in: header
          name: X-Owner-Token
          required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: Checked; the updated custom domain
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            OWNER_AUTHORIZATION_FAILED: wrong token; OWNER_TOKEN_REVOKED or OWNER_TOKEN_EXPIRED; DOMAIN_NEEDS_ACCOUNT:
            custom domains need a free BrewPage profile: sign in at https://account.brewpage.app/tokens, press Add
            existing token and paste this owner token, then set the domain again; ACCOUNT_RESTRICTED or ACCOUNT_BLOCKED:
            this profile cannot add domains now
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_NOT_FOUND: no custom domain on this publication; PUBLICATION_UNAVAILABLE: missing or expired
            publication (outside public also for a wrong token); FEATURE_DISABLED: custom domains are not available
            right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_SUSPENDED: BrewPage suspended this domain; write to info@brewpage.app; DOMAIN_PROFILE_AMBIGUOUS: the
            token is in several profiles; set the domain with a profile token of the profile that should hold it
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); or DOMAIN_CHECK_TOO_SOON: checked a moment ago, wait
            Retry-After
      security:
        - OwnerToken: []
      summary: Check DNS of this publication's custom domain now
      tags:
        - Custom Domains
  /api/publications/{type}/{ns}/{id}/preview/{variant}.webp:
    get:
