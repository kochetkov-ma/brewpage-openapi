      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: Moved here or already set; same body as 201
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: Added to the profile and set on this publication
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'INVALID_HOSTNAME: not a valid hostname; DOMAIN_NOT_ALLOWED: this hostname cannot be used'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            OWNER_AUTHORIZATION_FAILED: wrong token; OWNER_TOKEN_REVOKED or OWNER_TOKEN_EXPIRED; DOMAIN_NEEDS_ACCOUNT:
            custom domains need a free BrewPage account; sign in at account.brewpage.app and add this token to your
            profile; ACCOUNT_RESTRICTED or ACCOUNT_BLOCKED: this account cannot add domains now
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            PUBLICATION_UNAVAILABLE: missing or expired publication (outside public also for a wrong token);
            FEATURE_DISABLED: custom domains are not available right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            NOT_ELIGIBLE: the publication cannot take a custom domain (`reason`); DOMAIN_LIMIT: the profile already
            holds all its custom domains (`limit`, `used`); remove or move one; DOMAIN_SUSPENDED: this domain is
            suspended; DOMAIN_PROFILE_AMBIGUOUS: the token is in several profiles; use a profile's admin token
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Rate limited: wait Retry-After (= retryAfterSeconds)'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_INTAKE_PAUSED: adding custom domains is paused; try again later; HOSTING_CREATION_PAUSED: address
            changes are briefly unavailable; retry after Retry-After
      security:
        - OwnerToken: []
      summary: Set a custom domain on this publication
      tags:
        - Custom Domains
