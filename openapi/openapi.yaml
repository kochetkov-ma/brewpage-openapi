            schema:
              type: string
          application/xml:
            schema:
              type: string
          application/yaml:
            schema:
              type: string
          text/css:
            schema:
              type: string
          text/csv:
            schema:
              type: string
          text/html:
            schema:
              type: string
          text/javascript:
            schema:
              type: string
          text/markdown:
            schema:
              type: string
          text/plain:
            schema:
              type: string
          text/x-toml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
          text/yaml:
            schema:
              type: string
        required: true
      responses:
        '201':
          content:
