                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid filter or cursor
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: OWNER_TOKEN_REVOKED or OWNER_TOKEN_EXPIRED
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'SECRETS_UNAVAILABLE: temporarily off'
