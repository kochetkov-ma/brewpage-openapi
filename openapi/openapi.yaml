        - in: header
          name: Range
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: Owner token to bypass password protection when no password supplied
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
          description: File content
          headers:
            X-BrewPage-Notice:
              description: 'Archives only: contents unverified; check before opening.'
              schema:
