            - $ref: '#/components/schemas/AbuseResult'
        retryAfterSeconds:
          format: int64
          type: integer
        status:
          format: int32
          type: integer
        supportedTypes:
          items:
            type: string
          type: array
        timestamp:
          format: date-time
          type: string
      required:
        - error
        - message
        - status
        - timestamp
      type: object
    FileListResponse:
      properties:
        contentType:
          description: Detected MIME type (e.g. image/png)
          type: string
        createdAt:
