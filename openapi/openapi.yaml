  /api/secrets:
    get:
      description: >-
        Secrets of the owner token; a profile token lists the whole profile. ended=false: active ones, newest first;
        ended=true: ended ones, newest end first. Never the secret link or its content.
      operationId: listSecrets
      parameters:
        - description: 'false: active secrets; true: ended ones'
          in: query
