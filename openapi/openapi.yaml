          type: array
      required:
        - access
        - link
        - listed
      type: object
  securitySchemes:
    ManageKey:
      description: 'Key from manageUrl (#k=…): private, full control of one publication.'
      in: header
      name: X-Manage-Key
      type: apiKey
    OwnerToken:
      in: header
      name: X-Owner-Token
      type: apiKey
    Password:
      in: header
      name: X-Password
      type: apiKey
externalDocs:
  description: BrewPage API documentation (Scalar)
  url: https://kochetkov-ma.github.io/brewpage-openapi/
info:
  contact:
    email: info@brewpage.app
    name: BrewPage
    url: https://brewpage.app
  description: >-
    Free instant hosting for HTML, Markdown, JSON, key-value stores, files and sites. Send ns=public to be found:
    gallery + Google, Bing & AI search. Omitted ns: private (MCP: a generated private namespace). Password or hidden:
    unlisted. A private link is not a lock: anyone with it can open it; add a password to restrict. Secrets allowed;
    likely ones are flagged in notices. For a secret: private namespace + password. Retain returned links. Give the user
    link and manageUrl; manageUrl is private (anyone who has it can edit or delete the publication): never post it
    publicly. Keep ownerToken; send it as X-Owner-Token on later publishes and updates; show it to the user on request.
    How BrewPage compares with GitHub Pages, GitHub Gist, Netlify Drop, Cloudflare Drop, Tiiny Host and Static.app:
    https://brewpage.app/compare. Agents: remote MCP at https://brewpage.app/mcp (no auth).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  termsOfService: https://brewpage.app/terms
  title: BrewPage API
  version: 0.0.1-SNAPSHOT
openapi: 3.1.0
paths:
  /api/domains:
    get:
      description: Lists every custom domain of the profile with `limit` and `used`.
      operationId: listDomains
      parameters:
        - description: Admin token of your BrewPage profile
          in: header
          name: X-Owner-Token
          required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainListResponse'
          description: The profile's custom domains
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Missing token, or ADMIN_TOKEN_REQUIRED: not an admin token of a profile; OWNER_TOKEN_REVOKED or
            OWNER_TOKEN_EXPIRED
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'FEATURE_DISABLED: custom domains are not available right now'
      security:
        - OwnerToken: []
      summary: Custom domains of the profile
      tags:
        - Custom Domains
    post:
      description: >-
        Adds a hostname to the profile without showing a publication yet (attach one later with PUT
        /api/domains/{hostname}/attachment). Create the DNS `records[]` of the answer, then call POST
        /api/domains/{hostname}/check until `status` is `active`.
      operationId: addDomain
      parameters:
        - description: Admin token of your BrewPage profile
          in: header
          name: X-Owner-Token
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDomainRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: Already in the profile; same body as 201
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: Added to the profile
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'INVALID_HOSTNAME: not a valid hostname; DOMAIN_NOT_ALLOWED: this hostname cannot be used'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Missing token, or ADMIN_TOKEN_REQUIRED: not an admin token of a profile; OWNER_TOKEN_REVOKED or
            OWNER_TOKEN_EXPIRED; ACCOUNT_RESTRICTED or ACCOUNT_BLOCKED: this account cannot add domains now
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'FEATURE_DISABLED: custom domains are not available right now'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'DOMAIN_LIMIT: the profile already holds all its custom domains (`limit`, `used`); remove or move one'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Rate limited: wait Retry-After (= retryAfterSeconds)'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'DOMAIN_INTAKE_PAUSED: adding custom domains is paused; try again later'
      security:
        - OwnerToken: []
      summary: Add a hostname to the profile
      tags:
        - Custom Domains
  /api/domains/{hostname}:
    delete:
      description: >-
        Removes the hostname from the profile; the slot is free at once. Remove its DNS records afterwards if you no
        longer need them.
      operationId: removeDomain
      parameters:
        - description: Hostname, e.g. www.example.com (Unicode or ASCII form)
          in: path
          name: hostname
          required: true
          schema:
            type: string
        - description: Admin token of your BrewPage profile
          in: header
          name: X-Owner-Token
          required: true
      responses:
        '204':
          description: Removed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Missing token, or ADMIN_TOKEN_REQUIRED: not an admin token of a profile; OWNER_TOKEN_REVOKED or
            OWNER_TOKEN_EXPIRED; ACCOUNT_RESTRICTED or ACCOUNT_BLOCKED: this account cannot add domains now
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_NOT_FOUND: the hostname is not in this profile; FEATURE_DISABLED: custom domains are not available
            right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'DOMAIN_SUSPENDED: this domain is suspended'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Rate limited: wait Retry-After (= retryAfterSeconds)'
      security:
        - OwnerToken: []
      summary: Remove a hostname from the profile
      tags:
        - Custom Domains
    get:
      description: Reads one custom domain of the profile as last checked; POST /api/domains/{hostname}/check refreshes it.
      operationId: getDomain
      parameters:
        - description: Hostname, e.g. www.example.com (Unicode or ASCII form)
          in: path
          name: hostname
          required: true
          schema:
            type: string
        - description: Admin token of your BrewPage profile
          in: header
          name: X-Owner-Token
          required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: The custom domain
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Missing token, or ADMIN_TOKEN_REQUIRED: not an admin token of a profile; OWNER_TOKEN_REVOKED or
            OWNER_TOKEN_EXPIRED
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_NOT_FOUND: the hostname is not in this profile; FEATURE_DISABLED: custom domains are not available
            right now
      security:
        - OwnerToken: []
      summary: One custom domain of the profile
      tags:
        - Custom Domains
  /api/domains/{hostname}/attachment:
    delete:
      description: >-
        Stops showing the publication on this hostname; the hostname stays in the profile with its slot and DNS state,
        ready to attach another one.
      operationId: detachDomain
      parameters:
        - description: Hostname, e.g. www.example.com (Unicode or ASCII form)
          in: path
          name: hostname
          required: true
          schema:
            type: string
        - description: Admin token of your BrewPage profile
          in: header
          name: X-Owner-Token
          required: true
      responses:
        '204':
          description: Detached, or nothing was attached
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Missing token, or ADMIN_TOKEN_REQUIRED: not an admin token of a profile; OWNER_TOKEN_REVOKED or
            OWNER_TOKEN_EXPIRED
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_NOT_FOUND: the hostname is not in this profile; FEATURE_DISABLED: custom domains are not available
            right now
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Rate limited: wait Retry-After (= retryAfterSeconds)'
      security:
        - OwnerToken: []
      summary: Detach the publication
      tags:
        - Custom Domains
    put:
      description: >-
        Shows an HTML page or site of yours on this hostname; body `{type, ns, id}`. The hostname is added to the
        profile when it is not there yet (201) or moved from its current publication (200). The admin token must also
        prove ownership of the publication (its owner token in this profile, or a profile token that reaches it). Same
        rules and next steps as PUT /api/publications/{type}/{ns}/{id}/domain.
      operationId: attachDomain
      parameters:
        - description: Hostname, e.g. www.example.com (Unicode or ASCII form)
          in: path
          name: hostname
          required: true
          schema:
            type: string
        - description: Admin token of your BrewPage profile
          in: header
          name: X-Owner-Token
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDomainRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: Moved here or already shown; same body as 201
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: Added to the profile and shown on this publication
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Missing type, ns or id; INVALID_HOSTNAME: not a valid hostname; DOMAIN_NOT_ALLOWED: this hostname cannot be
            used
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Missing token, or ADMIN_TOKEN_REQUIRED: not an admin token of a profile; OWNER_TOKEN_REVOKED or
            OWNER_TOKEN_EXPIRED; OWNER_AUTHORIZATION_FAILED: wrong token; OWNER_TOKEN_REVOKED or OWNER_TOKEN_EXPIRED;
            ACCOUNT_RESTRICTED or ACCOUNT_BLOCKED: this account cannot add domains now
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            PUBLICATION_UNAVAILABLE: missing or expired publication (outside public also for a wrong token);
            FEATURE_DISABLED: custom domains are not available right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            NOT_ELIGIBLE: the publication cannot take a custom domain (`reason`); DOMAIN_LIMIT: the profile already
            holds all its custom domains (`limit`, `used`); remove or move one; DOMAIN_SUSPENDED: this domain is
            suspended
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Rate limited: wait Retry-After (= retryAfterSeconds)'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_INTAKE_PAUSED: adding custom domains is paused; try again later; HOSTING_CREATION_PAUSED: address
            changes are briefly unavailable; retry after Retry-After
      security:
        - OwnerToken: []
      summary: Show a publication on this hostname
      tags:
        - Custom Domains
  /api/domains/{hostname}/check:
    post:
      description: >-
        Runs a DNS check now and returns the updated state; call it after creating the records in `records[]`. BrewPage
        also checks on its own (`nextCheckAt`) and resumes paused checks (CHECK_PAUSED) on this call. Checks are spaced:
        a repeat too soon answers 429 DOMAIN_CHECK_TOO_SOON; wait Retry-After.
      operationId: checkDomain
      parameters:
        - description: Hostname, e.g. www.example.com (Unicode or ASCII form)
          in: path
          name: hostname
          required: true
          schema:
            type: string
        - description: Admin token of your BrewPage profile
          in: header
          name: X-Owner-Token
          required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainItem'
          description: Checked; the updated custom domain
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Missing token, or ADMIN_TOKEN_REQUIRED: not an admin token of a profile; OWNER_TOKEN_REVOKED or
            OWNER_TOKEN_EXPIRED; ACCOUNT_RESTRICTED or ACCOUNT_BLOCKED: this account cannot add domains now
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            DOMAIN_NOT_FOUND: the hostname is not in this profile; FEATURE_DISABLED: custom domains are not available
            right now
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'DOMAIN_SUSPENDED: this domain is suspended'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); or DOMAIN_CHECK_TOO_SOON: checked a moment ago, wait
            Retry-After
      security:
        - OwnerToken: []
      summary: Check DNS of a custom domain now
      tags:
        - Custom Domains
  /api/files:
    get:
      description: >-
        Returns files owned by the given token. Empty list without token. Files published as pages are listed by GET
        /api/publications
      operationId: list_1
      parameters:
        - description: 'Namespace. Omitted: private. `public` = gallery & search. Lowercase only.'
          in: query
          name: ns
          required: false
          schema:
            pattern: ^$|^[a-z0-9-]{1,32}$
            type: string
        - description: Owner token to filter by ownership. Without token returns empty list
          in: header
          name: X-Owner-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FileListResponse'
                type: array
          description: File list
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Owner token revoked or expired
      security:
        - {}
        - OwnerToken: []
      summary: List files
      tags:
        - Files
    post:
      description: >-
        Stores a file via multipart upload and returns a download link. Only safe file types accepted; a missing or
        wrong extension is corrected from the content and reported in notices. Reuse existing owner token to group
        entities under one owner. An HTML or Markdown file is published as a page in any namespace, with or without a
        password (same rules and limits as POST /api/html). 'format' decides; without one a known extension, then a
        specific declared part type (text/html, text/markdown, application/json, text/csv), then a content guess;
        otherwise it stays an inert file. '.txt' without 'format' stays a text file. A whole HTML document sent as
        'markdown' is an HTML page. Any readable encoding is stored as UTF-8, notice 'charset-guessed' when no usable
        charset was named. link and ownerLink point to the page, notice 'html-file-as-page' or 'markdown-file-as-page';
        a code format chosen by 'format' or the declared type is published the same way, notice 'file-format-applied'.
        An HTML file over the page size limit or that no encoding reads is stored as a file and shown as source, notice
        'html-file-as-source'. Secrets allowed; likely ones are flagged in notices. For a secret: private namespace +
        password.
      operationId: upload
      parameters:
        - description: >-
            Send ns=public for anything meant to be found or shared (docs, guides, demos, portfolios, reports, landing
            pages): listed in the public gallery and sitemap, so Google, Bing and AI search index it and people discover
            it. Public pages are served on the brewpage.app domain itself, for the strongest search reach; code that
            needs its own origin (cookies, storage) gets its own subdomain automatically. Anyone can find and read a
            public page: never put secrets, tokens or personal data there. No ns (default): private. Unlisted and not
            indexed; anyone who has the link can still open it. Lowercase only.
          in: query
          name: ns
          required: false
          schema:
            pattern: ^$|^[a-z0-9-]{1,32}$
            type: string
        - description: Comma-separated tags
          example: demo,test
          in: query
          name: tags
          required: false
          schema:
            type: string
        - description: 'Format of a page published from this file: decides over the file name. Unknown values are ignored.'
          in: query
          name: format
          required: false
          schema:
            type: string
        - description: >-
            TTL in days (1-30, up to 90 with an X-Owner-Token in a profile); omitted or blank uses 15 days. Accepts 15,
            15d, 15 days; h/w/mo/y units round up to whole days. Out-of-range values are clamped and unparseable ones
            use the default; each adjustment is reported in notices.
          in: query
          name: ttl
          required: false
          schema:
            type: string
        - description: >-
            Access password. Empty = public file visible in gallery. With password = hidden from gallery; readers unlock
            the publication or use X-Password for API access
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - in: header
          name: X-Delivery-Mode
          required: false
          schema:
            type: string
        - description: >-
            For an HTML file published as a page: store it exactly as sent. By default a whole HTML page pasted from a
            chat (wrapped in a code block, surrounded by chat text, or entity-escaped) is restored and a notice is
            returned; 'true' keeps the text as is.
          in: query
          name: verbatim
          schema:
            type: boolean
        - description: Reuse existing owner token to group entities under one owner. If omitted, a new token is generated
          in: header
          name: X-Owner-Token
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: File part; any single file part is accepted when 'file' is absent
                  format: binary
                  type: string
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
          description: >-
            File uploaded, or HTML or Markdown file published as a page. Header X-Existing-Resource: 1 when an existing
            publication with the same content was returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request or file too large; or PDF/Office file unreadable or password-protected
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Upload refused
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unsupported file type or content of no supported type
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Busy; retry after Retry-After seconds
      security:
        - {}
        - OwnerToken: []
      summary: Upload file
      tags:
        - Files
  /api/files/{ns}/{id}:
    delete:
      description: >-
