  /api/sites/{ns}/{id}/files/{filePath}:
    get:
      description: Serves an individual file from the site with correct content type
      operationId: serveSiteFile
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Access password via header
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: >-
            Legacy-only query password; ignored for NEW publications. Programmatic access uses X-Password or the owner
            token.
          in: query
          name: p
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: Owner token to bypass password protection when no password supplied
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
        - in: header
          name: Range
          required: false
          schema:
            type: string
        - description: Relative file path, including nested directories; encode each segment and retain slash separators.
          in: path
          name: filePath
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
          description: File content
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong password
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Site or file not found
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Public publication deleted or expired
      security:
        - {}
        - OwnerToken: []
        - Password: []
