  /api/{ns}/{id}/owner-check:
    get:
      description: >-
        Returns `{isOwner, type}`, plus `format` for an `html`-type resource. 404 or 410 exactly as reading the resource
        would answer. 200 with `isOwner:false` when no credential is sent or it does not own the resource.
      operationId: ownerCheck
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token to verify
          in: header
          name: X-Owner-Token
        - description: Management key to verify
          in: header
          name: X-Manage-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerCheckResponse'
          description: OK
      security:
        - {}
        - OwnerToken: []
        - ManageKey: []
      summary: Verify whether the supplied X-Owner-Token or X-Manage-Key owns the resource
      tags:
        - Owner Check
  /api/{ns}/{id}/state:
    get:
      description: >-
        Settings in effect, each list with its entry count and size, quota tier and usage. A publication that has not
        turned page data on answers declared:false with the default settings. notices: state-needs-subdomain while the
        page is on a brewpage.app/... address (give it its own address: PATCH /api/{type}/{ns}/{id}/hosting),
        state-needs-html while the page is not HTML.
      operationId: readPageDataSettings
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this publication
          in: header
          name: X-Manage-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateConfigResponse'
          description: Settings and usage
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Owner token revoked or expired; or OWNER_AUTHORIZATION_FAILED: a public publication you do not own'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'PUBLICATION_UNAVAILABLE: no such HTML page or site, not yours, hidden or expired'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'STATE_UNAVAILABLE: page data is switched off for now; wait Retry-After'
      security:
        - OwnerToken: []
        - ManageKey: []
      summary: Read page data settings and usage
      tags:
        - Page data
    patch:
      description: >-
        The body is the whole settings object, the same shape as `state` on publish (at most 16 KB): lists absent from
        it are removed (their entries stay, the list becomes private), top-level keys absent from it return to their
        defaults, and a named list keeps the mode and write it has unless the body states them. {} turns page data on
        with the defaults; null turns it off (entries are kept). A private list that holds visitors' entries cannot
        become shared (409 STATE_MODE_WIDENING). Answers like the read, with notices about clamped limits, ignored keys
        and the address.
      operationId: changePageDataSettings
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this publication
          in: header
          name: X-Manage-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateSettingsRequest'
        description: Page data settings JSON, or null to turn page data off
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateConfigResponse'
          description: Settings saved; same answer as the read
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'STATE_INVALID: the settings have a mistake; nothing was changed'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Owner token revoked or expired; or OWNER_AUTHORIZATION_FAILED: a public publication you do not own'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'PUBLICATION_UNAVAILABLE: no such HTML page or site, not yours, hidden or expired'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            STATE_MODE_WIDENING: a private list with visitors' entries cannot become shared; or
            OLD_PUBLICATION_READ_ONLY
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Settings larger than 16 KB
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
