      operationId: resolve
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Access password for protected resources
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: >-
            Legacy-only query password; ignored for NEW publications. Programmatic access uses X-Password or the owner
            token.
          in: query
          name: p
          required: false
          schema:
            type: string
        - description: Force download as attachment
          in: query
          name: dl
          required: false
          schema:
            type: boolean
        - description: 'Bypass SPA: stream raw bytes directly (used by <video src>, <iframe src> for PDF, embed cases)'
          in: query
          name: raw
          required: false
          schema:
            type: boolean
        - description: Legacy site wrapper bypass; NEW publications retain stored hosting and protection policies
          in: query
          name: inline
          required: false
          schema:
            type: boolean
        - in: header
          name: Range
          required: false
          schema:
            type: string
        - in: header
          name: X-Resolve
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - in: header
          name: Accept
          required: false
          schema:
            type: string
        - description: 'Owner token; when supplied, response carries X-Is-Owner: true on match'
          in: header
          name: X-Owner-Token
          schema:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
          description: OK
      security:
        - {}
        - OwnerToken: []
        - Password: []
      summary: Open short link
      tags:
