    SecretCreateRequest:
      properties:
        ciphertext:
          description: >-
            AES-GCM-256 output (encrypted text plus its 16-byte tag) as base64url without padding, at most 54000
            characters. Encrypt in the client; the key never reaches the server.
          maxLength: 54000
          minLength: 23
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        iv:
          description: The 12-byte AES-GCM nonce as 16 base64url characters.
          maxLength: 16
          minLength: 16
          pattern: ^[A-Za-z0-9_-]{16}$
          type: string
        keyCheck:
          description: >-
            base64url of the first 16 bytes of SHA-256("brewpage-secret-key-check-v1" + the 32 key bytes): the page
            checks a key against it before spending a view.
          maxLength: 22
          minLength: 22
          pattern: ^[A-Za-z0-9_-]{22}$
          type:
            - string
            - 'null'
        kind:
          default: text
          description: 'text: UTF-8 text; file: one file in envelope v1. Omitted: text.'
          enum:
            - text
            - file
          type:
            - string
            - 'null'
        maxViews:
          default: 1
          description: 'How many times it can be opened, 1 to 10. Omitted: 1.'
          format: int32
          maximum: 10
          minimum: 1
          type:
            - integer
            - 'null'
        note:
          description: Your own note, at most 500 characters; only you see it.
          maxLength: 500
          type:
            - string
            - 'null'
        tags:
          description: Your tags, at most 10 of 1-32 characters; only you see them.
          items:
            maxLength: 32
            minLength: 1
            type: string
          maxItems: 10
          type: array
        title:
          description: 'Shown to the recipient before opening: never put the secret here. 1-200 characters, one line.'
          maxLength: 200
          minLength: 1
          type: string
        ttl:
          default: 7d
          description: 'How long the secret stays readable: 1h, 1d, 7d or 30d. Omitted: 7d.'
          enum:
            - 1h
            - 1d
            - 7d
            - 30d
          type:
            - string
            - 'null'
      required:
        - ciphertext
        - iv
        - title
      type: object
    SecretCreateResponse:
      properties:
        expiresAt:
          description: When the secret stops being readable
          format: date-time
          type: string
        id:
          description: 22-character secret id. Share https://brewpage.app/secret/{id}#{key}, the key in the fragment only.
          type: string
        kind:
          description: text or file
          enum:
            - text
            - file
          type: string
        manageUrl:
          description: 'Private manage link (status, opens, delete): give it to the creator only, never to the recipient'
