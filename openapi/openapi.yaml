# Generated from backend public JSON; do not hand-edit.
components:
  schemas:
    AccessRevokeResponse:
      properties:
        revoked:
          type: boolean
      type: object
    AddDomainRequest:
      description: Add a hostname to the profile without a publication.
      properties:
        hostname:
          description: Hostname to add, e.g. www.example.com or example.com; Unicode names accepted
          type:
            - string
            - 'null'
      required:
        - hostname
      type: object
    AttachDomainRequest:
      description: Publication to show on a profile hostname.
      properties:
        id:
          description: Id of the publication
          type:
            - string
            - 'null'
        ns:
          description: Namespace of the publication
          type:
            - string
            - 'null'
        type:
          description: html or site (sites accepted)
          type:
            - string
            - 'null'
      required:
        - id
        - ns
        - type
      type: object
    BindRequest:
      properties:
        token:
          description: Owner token to add to the profile
          type:
            - string
            - 'null'
      type: object
    BindResponse:
      properties:
        active:
          format: int32
          type: integer
        bound:
          type: boolean
        id:
          format: uuid
          type: string
        max:
          format: int32
          type: integer
      required:
        - active
        - bound
        - id
        - max
      type: object
    CustomDomainsBlock:
      description: Custom domains for this caller; present only when custom domains are available
      properties:
        enabled:
          description: Always true when present
          type: boolean
        limit:
          description: Hostnames the caller's profile may hold (profile grant or the default)
          format: int32
          type: integer
        used:
          description: Hostnames the profile holds; absent when no profile resolves and on /api/limits
          format: int32
          type: integer
      required:
        - enabled
        - limit
      type: object
    DomainAttachedTo:
      description: Publication a custom domain shows.
      properties:
        id:
          type: string
        link:
          description: BrewPage link of the publication; keeps working next to the custom domain
          type: string
        namespace:
          type: string
        title:
          type: string
        type:
          description: >-
            html or site (the {type} path segment of /api/publications/{type}/{ns}/{id}; sites also accepts site and
            sites)
          type: string
      required:
        - id
        - link
        - namespace
        - type
      type: object
    DomainItem:
      description: >-
        A custom domain of a profile and what to do next: create the `records[]` in DNS, then call the check route until
        `status` is `active`.
      properties:
        apex:
          description: >-
            true when the hostname is the registered domain itself (example.com): routing uses an A or ALIAS record
            instead of CNAME
          type: boolean
        attachedTo:
          description: Publication shown on this hostname; absent when none is attached or it is gone
          oneOf:
            - $ref: '#/components/schemas/DomainAttachedTo'
        checkedAt:
          description: Last DNS check
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        deliveryModeChanged:
          description: >-
            Set answers only: true when the publication moved from its BrewPage path address to its own subdomain
            (required for a custom domain)
          type: boolean
        detached:
          description: 'Set answers only: hostname that was on this publication before; it stays in the profile, unattached'
          type: string
        displayHostname:
          description: Unicode form for display
          type: string
        graceEndsAt:
          description: 'While lost: when the hostname is released if DNS stays broken'
          format: date-time
          type: string
        hostname:
          description: Hostname in ASCII (A-label), lowercase, e.g. www.example.com
          type: string
        nextCheckAt:
          description: Next automatic DNS check; absent while checks are paused
          format: date-time
          type: string
        problem:
          description: >-
            What blocks progress now, absent when nothing does: TXT_MISSING, TXT_WRONG, ROUTING_MISSING, ROUTING_WRONG,
            FOREIGN_AAAA, CAA_BLOCKS (fix the matching row of records[]), DOMAIN_TAKEN (this hostname is not available),
            QUEUE_FULL (DNS is right, verification waits its turn; retried automatically), CERT_PENDING (certificate on
            its way), CERT_FAILED (certificate could not be issued; check DNS, then check again), DNS_LOST (records
            stayed broken past the grace period; restore them and check again), CHECK_PAUSED (checks paused after long
            failure; the check route resumes them), RESOLVER_UNAVAILABLE (DNS did not answer; retried), PUBLICATION_GONE
            (attach another publication), NOT_ELIGIBLE_<reason> (the publication cannot take a custom domain; reasons as
            ErrorResponse.reason)
          type: string
        provider:
          description: >-
            DNS provider once known: cloudflare, godaddy, namecheap, porkbun, squarespace, ionos, hostinger, ovh,
            route53, other
          type: string
        records:
          description: 'DNS records to create, in order: TXT for ownership, then CNAME (subdomain) or A plus optional ALIAS (apex)'
          items:
            $ref: '#/components/schemas/DomainRecord'
          type: array
        serving:
          description: true when visitors see the publication on this hostname now
          type: boolean
        status:
          description: >-
            pending_dns (create the records), verifying (DNS found, certificate being issued), active (serving) or lost
            (DNS changed after activation; still serving until graceEndsAt, fix the records)
          enum:
            - pending_dns
            - verifying
            - active
            - lost
          type: string
        suspended:
          description: 'true when BrewPage suspended this domain: it does not serve and cannot be checked, moved or removed'
          type: boolean
        url:
          description: https://<hostname>/ while serving
          type: string
      required:
        - apex
        - createdAt
        - displayHostname
        - hostname
        - records
        - serving
        - status
        - suspended
      type: object
    DomainListResponse:
      description: Custom domains of a profile.
      properties:
        items:
          items:
            $ref: '#/components/schemas/DomainItem'
          type: array
        limit:
          description: Hostnames the profile may hold
          format: int32
          type: integer
        used:
          description: Hostnames the profile holds
          format: int32
          type: integer
      required:
        - items
        - limit
        - used
      type: object
    DomainRecord:
      description: >-
        One DNS record to create at your DNS provider exactly as given; AAAA and CAA rows appear only when they need
        fixing. Always take values from here, never hard-code them.
      properties:
        host:
          description: 'Name as DNS panels ask for it, relative to the registered domain: www, _brewpage.www or @'
          type: string
        name:
          description: Full DNS name, e.g. _brewpage.www.example.com
          type: string
        optional:
          description: 'true on the ALIAS (flattened CNAME) alternative to the apex A record: create one of the two'
          type: boolean
        state:
          description: >-
            From the last check: ok, missing, wrong (another value found), foreign (AAAA record pointing elsewhere:
            delete it), blocked (CAA record forbids the certificate: add this one) or unknown (not checked yet, or DNS
            did not answer)
          type: string
        type:
          description: TXT (ownership), CNAME, A or ALIAS (routing), AAAA (delete it) or CAA (add it)
          type: string
        value:
          description: >-
            Value to publish (AAAA: the record found, to delete); absent while not known yet, then use the optional
            ALIAS row
          type: string
      required:
        - host
        - name
        - state
        - type
      type: object
    ErrorResponse:
      properties:
        accountUrl:
          description: 'Write 429 without an account: free account with higher limits'
          type: string
        challengeUrl:
          description: 'With STATE_CHALLENGE on a custom domain only: https address of the check page to frame'
          type: string
        code:
          description: >-
            Machine-readable reason, e.g. OWNER_AUTHORIZATION_FAILED, OWNER_TOKEN_REVOKED, OWNER_TOKEN_EXPIRED,
            ADMIN_TOKEN_REQUIRED, OLD_PUBLICATION_READ_ONLY, WRONG_RESOURCE_TYPE, PUBLICATION_UNAVAILABLE,
            ROTATE_LIMITED, TITLE_INVALID.
          type: string
        createUrl:
          description: >-
            With OLD_PUBLICATION_READ_ONLY or a write 404: create endpoint (same namespace); POST the content there to
            publish it anew.
          type: string
        error:
          type: string
        limit:
          format: int32
          type: integer
        message:
          type: string
        reason:
          description: >-
            With NOT_ELIGIBLE: why the publication cannot take a custom domain: OWNERSHIP (the profile does not manage
            it), OLD (publish it again), RETIRED, TYPE (only HTML pages and sites), FORMAT (only format html), PASSWORD
            (remove the password), EXPIRED or MODE
          type: string
        republishUrl:
          description: 'With OLD_PUBLICATION_READ_ONLY on an HTML page: browser composer to publish it anew.'
          type: string
        resourceUrl:
          description: 'With WRONG_RESOURCE_TYPE: API URL of this id''s real type; repeat the write there.'
          type: string
        result:
          oneOf:
            - $ref: '#/components/schemas/PublicationResult'
        retryAfterSeconds:
          description: Seconds to wait; same as Retry-After
          format: int64
          type: integer
        siteKey:
          description: 'With STATE_CHALLENGE: Turnstile site key for the human check (action state_write)'
          type: string
        status:
          format: int32
          type: integer
        supportedTypes:
          items:
            type: string
          type: array
        timestamp:
          format: date-time
          type: string
        used:
          description: 'With DOMAIN_LIMIT: custom domains the profile already uses (`limit` = how many it may hold)'
          format: int32
          type: integer
      required:
        - error
        - message
        - status
        - timestamp
      type: object
    ExtendResponse:
      properties:
        expiresAt:
          format: date-time
          type: string
        notices:
          description: Advisories about the request or its result; omitted when none.
          items:
            $ref: '#/components/schemas/PublishNotice'
          type: array
      required:
        - expiresAt
      type: object
    FileLimitsResponse:
      description: File upload; maxFiles per namespace
      properties:
        defaultTtlDays:
          format: int32
          type: integer
        maxAudioBytes:
          format: int64
          type: integer
        maxFileBytes:
          format: int64
          type: integer
        maxFiles:
          format: int32
          type: integer
        maxTtlDays:
          format: int32
          type: integer
        maxVideoBytes:
          format: int64
          type: integer
      required:
        - defaultTtlDays
        - maxAudioBytes
        - maxFileBytes
        - maxFiles
        - maxTtlDays
        - maxVideoBytes
      type: object
    FileListResponse:
      properties:
        contentType:
          description: Detected MIME type (e.g. image/png)
          type: string
        createdAt:
          format: date-time
          type: string
        filename:
          description: Original filename as uploaded
          type: string
        id:
          description: Unique 10-character alphanumeric file ID
          type: string
        link:
          description: Public short URL for browser download
          type: string
        size:
          format: int64
          type: integer
      required:
        - createdAt
        - filename
        - id
        - link
        - size
      type: object
    FileUpdateResponse:
      description: >-
        Replace result. For a file published as a page (notice 'html-file-as-page', 'markdown-file-as-page' or
        'file-format-applied') the page was replaced
      properties:
        contentType:
          description: Detected MIME type of the new content
          type: string
        expiresAt:
          description: 'Unchanged: updates keep the original expiry'
          format: date-time
          type: string
        filename:
          description: Stored name of the new content
          type: string
        id:
          type: string
        link:
          type: string
        listed:
          description: true = listed in the gallery and sitemap now (public, no password, not hidden).
          type: boolean
        namespace:
          type: string
        notices:
          description: Advisories about the request or its result; omitted when none.
          items:
            $ref: '#/components/schemas/PublishNotice'
          type: array
        ownerLink:
          type: string
        sizeBytes:
          format: int64
          type: integer
      required:
        - expiresAt
        - filename
        - id
        - link
        - listed
        - namespace
        - ownerLink
        - sizeBytes
      type: object
    FileUploadResponse:
      description: >-
        Upload result. For a file published as a page (notice 'html-file-as-page', 'markdown-file-as-page' or
        'file-format-applied') id, link and ownerLink belong to that page; manage it via /api/html
      properties:
        access:
          description: >-
            public: html, site and file listed in gallery and sitemap. unlisted: private, not listed. protected: link +
            password.
          enum:
            - public
            - unlisted
            - protected
          type: string
        contentType:
          description: Detected MIME type (e.g. image/png); the page type (text/html, text/markdown) for a file published as a page
          type: string
        deliveryMode:
          type:
            - string
            - 'null'
        deliveryModeMatched:
          type:
            - boolean
            - 'null'
        deliveryModeReason:
          description: >-
            Why the request was served differently than asked: 'policy:subdomain-required', 'policy:mode-locked',
            'policy:classic-link', 'policy:version-stale', 'policy:republish-keeps-mode',
            'policy:custom-domain-attached' or 'policy:state-declared'. Mismatches are reported, not rejected. Absent
            when nothing applies.
          type: string
        deliveryNotice:
          description: Human-readable explanation of deliveryModeReason. Absent whenever deliveryModeReason is absent.
          type: string
        effectiveDeliveryMode:
          type:
            - string
            - 'null'
        expiresAt:
          format: date-time
          type: string
        filename:
          description: Original filename as uploaded
          type: string
        hostingVersion:
          format: int64
          type:
            - integer
            - 'null'
        id:
          description: Unique 10-character alphanumeric file ID, or the page ID when the HTML file was published as a page
          type: string
        link:
          description: Primary URL returned for browser download and sharing
          type: string
        listed:
          description: true = listed in the gallery and sitemap now (public, no password, not hidden).
          type: boolean
        manageUrl:
          description: >-
            Management link, full control of this one publication. Give it to the user with the link; it is private,
            never post it publicly. Present only when minted.
          type: string
        managementLink:
          type:
            - string
            - 'null'
        modeLocked:
          type: boolean
        namespace:
          type: string
        notices:
          description: Advisories about the request or its result; omitted when none.
          items:
            $ref: '#/components/schemas/PublishNotice'
          type: array
        ownerLink:
          description: API URL for programmatic access (delete); /api/html/{ns}/{id} for a published page
          type: string
        ownerToken:
          description: >-
            Owner token: keep it (cannot be recovered; show it to the user on request); send it as X-Owner-Token on
            later publishes and updates. Absent when result.extras.isOwner is false
          type: string
        requestedDeliveryMode:
          type:
            - string
            - 'null'
        result:
          description: >-
            Present when an existing publication was returned: action merged, extras.isOwner says if ownerToken manages
            it
          oneOf:
            - $ref: '#/components/schemas/PublicationResult'
        routingCohort:
          type: string
        sizeBytes:
          description: Stored size in bytes; for a published page the page size (UTF-8 BOM removed)
          format: int64
          type: integer
        tags:
          items:
            type: string
          type: array
        updated:
          description: 'Owner only: true if this upload replaced your stored page; else absent.'
          type: boolean
        visibilityNotice:
          description: >-
            Link access in words, e.g. 'Public: listed in the gallery and sitemap; search engines can index it.' (public
            html, site and file add a hide hint), 'Public: anyone with the link. Not listed.' (public json, kv),
            'Private: not listed. Only via your unique private link.' or 'Password: link + password.'
          type: string
        visibilityUrl:
          description: 'Owner: POST {"listed":false|true} here to hide or show. Link unchanged.'
          type: string
      required:
        - access
        - deliveryMode
        - deliveryModeMatched
        - effectiveDeliveryMode
        - expiresAt
        - filename
        - hostingVersion
        - id
        - link
        - managementLink
        - modeLocked
        - namespace
        - ownerLink
        - requestedDeliveryMode
        - routingCohort
        - sizeBytes
        - tags
      type: object
    GalleryItem:
      properties:
        createdAt:
          format: date-time
          type: string
        deliveryMode:
          type:
            - string
            - 'null'
        expiresAt:
          description: 'mine=true only: when the publication expires'
          format: date-time
          type:
            - string
            - 'null'
        format:
          description: 'type=file: lowercase extension, else null'
          type:
            - string
            - 'null'
        hostingVersion:
          format: int64
          type:
            - integer
            - 'null'
        id:
          type: string
        link:
          type:
            - string
            - 'null'
        listed:
          description: 'mine=true only: false for private, password or hidden items (Hidden = public + false)'
          type:
            - boolean
            - 'null'
        managementLink:
          type:
            - string
            - 'null'
        namespace:
          description: >-
            Namespace the item lives in — 'public' on default responses; mine=true returns the real namespace (e.g.
            'public', 'secret-ns') so the frontend can build correct /{ns}/{id} links
          type:
            - string
            - 'null'
        preview:
          description: WebP previews; null while previews are off and on password rows
          oneOf:
            - $ref: '#/components/schemas/PublicationPreviewResponse'
            - type: 'null'
        routingCohort:
          type: string
        title:
          description: Display title derived from content or filename
          type: string
        type:
          description: >-
            Publication type: a page's stored format ('html', 'markdown' or a code format such as 'json', 'yaml',
            'txt'), 'file', or 'site'
          type: string
        views:
          description: Total view count
          format: int64
          type: integer
        visibility:
          description: >-
            Per-item visibility classification — public on default responses; my_public/my_public_password/my_private on
            mine=true
          enum:
            - public
            - my_public
            - my_public_password
            - my_private
          type:
            - string
            - 'null'
      type: object
    GalleryPromoCaptions:
      properties:
        bottom:
          description: Caption of the block below the gallery
          type: string
        top:
          description: Caption of the block above the gallery
          type: string
      type: object
    GalleryPromoItem:
      properties:
        chips:
          description: 'Feature chips: ''page-data'', ''custom-domain'', ''api''; empty for video'
          items:
            type: string
          type: array
        durationSeconds:
          description: 'kind=video: length in seconds; absent otherwise'
          format: int32
          type:
            - integer
            - 'null'
        id:
          description: Publication id in the public namespace
          type: string
        isNew:
          type: boolean
        kind:
          description: Item kind
          enum:
            - template
            - video
          type: string
        link:
          description: Live address of the publication
          type: string
        mediaUrl:
          description: 'kind=video: the playable file; absent otherwise'
          type:
            - string
            - 'null'
        namespace:
          type: string
        pageUrl:
          description: 'kind=template: its template page; absent for video'
          type:
            - string
            - 'null'
        preview:
          description: WebP previews (the poster's when the item has one); null while previews are off
          oneOf:
            - $ref: '#/components/schemas/PublicationPreviewResponse'
            - type: 'null'
        slug:
          type: string
        sourceUrl:
          description: 'kind=template: its clean source as plain text; absent for video'
          type:
            - string
            - 'null'
        tier:
          description: 'kind=template: ''basic'' or ''more''; absent for video'
          enum:
            - basic
            - more
          type:
            - string
            - 'null'
        title:
          type: string
        views:
          description: Total view count
          format: int64
          type: integer
      type: object
    GalleryPromoPeriod:
      properties:
        endsAt:
          description: When the next period starts
          format: date-time
          type: string
        index:
          description: Rotation period number; slots stay the same within one period
          format: int64
          type: integer
      type: object
    GalleryPromoResponse:
      description: BrewPage examples pinned above and below the public gallery; rotates every period
      properties:
        captions:
          $ref: '#/components/schemas/GalleryPromoCaptions'
        items:
          description: Every live item in registry order; slots name items by slug
          items:
            $ref: '#/components/schemas/GalleryPromoItem'
          type: array
        period:
          $ref: '#/components/schemas/GalleryPromoPeriod'
        sectionUrl:
          description: Page listing every template
          type: string
        slots:
          $ref: '#/components/schemas/GalleryPromoSlots'
      type: object
    GalleryPromoSlots:
      properties:
        bottom:
          description: Slugs of the bottom block in card order; phones show the first
          items:
            type: string
          type: array
        top:
          description: Slugs of the top block in card order; phones show the first
          items:
            type: string
          type: array
      type: object
    GalleryResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/GalleryItem'
          type: array
        page:
          description: Current page number (1-based)
          format: int32
          type: integer
        scope:
          description: 'mine=true only: `profile` when the token is active in a profile (its rows are listed), else `token`'
          enum:
            - token
            - profile
          type:
            - string
            - 'null'
        size:
          description: Items per page
          format: int32
          type: integer
        total:
          description: Total number of matching items across all pages
          format: int64
          type: integer
      type: object
    HostOwnerCheckResponse:
      properties:
        id:
          description: Publication id; owners only
          type: string
        isOwner:
          type: boolean
        namespace:
          description: Publication namespace; owners only
          type: string
        type:
          description: Resource type (html, kv, json, file, site); owners only
          type: string
      required:
        - isOwner
      type: object
    HostingCustomDomain:
      description: Custom domain on the hosting answer of a publication.
      properties:
        displayHostname:
          description: Unicode form for display
          type: string
        hostname:
          description: Hostname in ASCII (A-label), lowercase
          type: string
        serving:
          description: true when visitors see the publication on this hostname now
          type: boolean
        status:
          description: pending_dns, verifying, active or lost (as DomainItem.status)
          type: string
        url:
          description: https://<hostname>/ while serving
          type: string
      required:
        - displayHostname
        - hostname
        - serving
        - status
      type: object
    HostingProjection:
      properties:
        access:
          description: >-
            public: html, site and file listed in gallery and sitemap. unlisted: private, not listed. protected: link +
            password.
          enum:
            - public
            - unlisted
            - protected
          type: string
        deliveryMode:
          type:
            - string
            - 'null'
        deliveryModeMatched:
          type:
            - boolean
            - 'null'
        deliveryModeReason:
          description: >-
            Why the request was served differently than asked: 'policy:subdomain-required', 'policy:mode-locked',
            'policy:classic-link', 'policy:version-stale', 'policy:republish-keeps-mode',
            'policy:custom-domain-attached' or 'policy:state-declared'. Mismatches are reported, not rejected. Absent
            when nothing applies.
          type: string
        deliveryNotice:
          description: Human-readable explanation of deliveryModeReason. Absent whenever deliveryModeReason is absent.
          type: string
        effectiveDeliveryMode:
          type:
            - string
            - 'null'
        hostingVersion:
          format: int64
          type:
            - integer
            - 'null'
        link:
          type: string
        managementLink:
          type:
            - string
            - 'null'
        modeLocked:
          type: boolean
        namespace:
          type: string
        ownerLink:
          type: string
        requestedDeliveryMode:
          type:
            - string
            - 'null'
        routingCohort:
          type: string
      required:
        - access
        - deliveryMode
        - deliveryModeMatched
        - effectiveDeliveryMode
        - hostingVersion
        - link
        - managementLink
        - modeLocked
        - namespace
        - ownerLink
        - requestedDeliveryMode
        - routingCohort
      type: object
    HostingReadResponse:
      properties:
        access:
          description: >-
            public: html, site and file listed in gallery and sitemap. unlisted: private, not listed. protected: link +
            password.
          enum:
            - public
            - unlisted
            - protected
          type: string
        createdAt:
          format: date-time
          type: string
        customDomain:
          description: >-
            This publication's custom domain in that profile; absent without one. Details: GET
            /api/publications/{type}/{ns}/{id}/domain
          oneOf:
            - $ref: '#/components/schemas/HostingCustomDomain'
            - type: 'null'
        customDomains:
          description: >-
            Custom domains of the publication's profile (`used` only when the owner proof names a profile); absent when
            custom domains are not available
          oneOf:
