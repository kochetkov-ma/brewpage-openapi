            /api/publications/{type}/{ns}/{id}/domain/check until `status` is `active`. Otherwise one notice says why it
            was not set: domain-needs-account, domain-limit-reached, domain-not-eligible, domain-invalid,
            domain-account-restricted, domain-profile-ambiguous or domain-unavailable. Updates ignore it (notice
            domain-ignored): use PUT /api/publications/{type}/{ns}/{id}/domain.
          in: query
          name: domain
          schema:
            type: string
        - description: Reuse existing owner token to group entities under one owner. If omitted, a new token is generated
          in: header
          name: X-Owner-Token
        - description: >-
            NEW delivery preference: path or subdomain. Sites and non-public HTML pages get subdomain; a mismatch is
            reported in deliveryModeReason, not rejected. Omission allows smart selection.
