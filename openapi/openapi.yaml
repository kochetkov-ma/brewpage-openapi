  /api/sites:
    post:
      description: >-
        Upload a multi-file HTML site as a ZIP archive or as individual files with paths. Returns a link to the
        published site. Secrets allowed; likely ones are flagged in notices. For a secret: private namespace + password.
      operationId: uploadSite
      parameters:
        - description: >-
            Send ns=public for anything meant to be found or shared (docs, guides, demos, portfolios, reports, landing
            pages): listed in the public gallery and sitemap, so Google, Bing and AI search index it and people discover
            it. A site always gets its own subdomain. Anyone can find and read a public page: never put secrets, tokens
            or personal data there. No ns (default): private. Unlisted and not indexed; anyone who has the link can
            still open it. Lowercase only.
          in: query
          name: ns
          required: false
          schema:
            pattern: ^$|^[a-z0-9-]{1,32}$
            type: string
        - description: Comma-separated tags
          example: demo,portfolio
          in: query
          name: tags
          required: false
          schema:
            type: string
        - description: >-
            TTL in days (1-30, up to 90 with an X-Owner-Token in a profile); omitted or blank uses 15 days. Accepts 15,
            15d, 15 days; h/w/mo/y units round up to whole days. Out-of-range values are clamped and unparseable ones
            use the default; each adjustment is reported in notices.
          in: query
          name: ttl
          required: false
          schema:
            type: string
        - description: Access password
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - in: header
          name: X-Delivery-Mode
          required: false
          schema:
            type: string
        - description: Reuse existing owner token to group entities under one owner
          in: header
          name: X-Owner-Token
        - description: >-
            Entry HTML file path (.html or .htm). Default: index.html, else the shallowest HTML file; a missing or
            non-HTML entry falls back to it and is reported in notices
          in: query
          name: entry
          schema:
            type: string
        - description: >-
            Custom domain to connect to the new publication, e.g. www.example.com or example.com (query parameter or
            form/multipart field). Needs an X-Owner-Token added to a free BrewPage profile; works for HTML pages of
            format html and for sites, without a password. The publication is always created; on success the answer
            carries `customDomain` with the DNS `records[]` to create, then call POST
            /api/publications/{type}/{ns}/{id}/domain/check until `status` is `active`. Otherwise one notice says why it
            was not set: domain-needs-account, domain-limit-reached, domain-not-eligible, domain-invalid,
            domain-account-restricted, domain-profile-ambiguous or domain-unavailable. Updates ignore it (notice
            domain-ignored): use PUT /api/publications/{type}/{ns}/{id}/domain.
          in: query
          name: domain
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              anyOf:
                - required:
                    - archive
                  type: object
                - required:
                    - files
                  type: object
              properties:
                archive:
                  description: ZIP archive; takes precedence over individual files.
                  format: binary
                  type: string
                files:
                  items:
                    format: binary
                    type: string
                  minItems: 1
                  type: array
                paths:
                  description: Optional paths aligned with files; omitted paths use original filenames.
                  items:
                    type: string
                  type: array
                state:
                  description: >-
                    Page data: lets visitors save entries on this site. Optional JSON text of the settings object, sent
                    as a text field or a file: it declares the lists and limits (e.g. {"collections":{"answers":{}}}; {}
                    turns it on with defaults). Each visitor reads and writes only their own entries unless a list is
                    shared; you, the author, read them all. Page data works on the site's own address
                    https://<label>.brewpage.app. null or no state field changes no page data settings, also when this
                    upload updates your existing site. Invalid settings answer 400 and nothing is published.
                  type: string
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteUploadResponse'
          description: Site uploaded
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Invalid request, no HTML files, or limits exceeded; see GET /api/limits; or PDF/Office file unreadable or
            password-protected
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Upload refused
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Request over the per-request size, too many files and form fields, or a file path too long; see GET
            /api/limits
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'No servable file left: every file has an unsupported or missing extension'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Busy; retry after Retry-After seconds
      security:
        - {}
        - OwnerToken: []
      summary: Upload site
      tags:
        - Sites
  /api/sites/{ns}/{id}:
    delete:
      description: Permanently removes the site and all its files from storage
      operationId: deleteSite
