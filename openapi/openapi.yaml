              schema:
                $ref: '#/components/schemas/SecretCreateResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            SECRET_CIPHERTEXT_INVALID, SECRET_IV_INVALID, SECRET_TTL_INVALID, SECRET_MAX_VIEWS_INVALID,
            SECRET_KIND_INVALID or SECRET_TOO_LARGE; or a body that is not a JSON object
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'OWNER_TOKEN_REVOKED or OWNER_TOKEN_EXPIRED: omit X-Owner-Token to get a new one'
        '409':
          content:
