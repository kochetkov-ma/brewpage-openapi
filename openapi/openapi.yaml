info:
  description: >-
    Free instant hosting for HTML, Markdown, JSON, key-value stores, files and sites. REST omission defaults to the
    public namespace; MCP omission creates an unlisted namespace. Unlisted URLs are accessible to anyone with the link;
    use a password for access restrictions. Retain returned links and ownership tokens. Public discovery requires
    eligibility; protected and non-public publications are excluded.
  title: BrewPage API
  version: 1.107.2
openapi: 3.1.0
paths:
  /api/files:
    get:
      description: Returns files owned by the given token. Empty list without token
      operationId: list_1
      parameters:
        - description: >-
            Namespace (default public). Custom namespaces are unlisted, accessible to anyone with the URL. Public
            discovery additionally requires eligibility and no password.
          in: query
          name: ns
          required: false
          schema:
            default: public
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - description: Owner token to filter by ownership. Without token returns empty list
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FileListResponse'
                type: array
          description: File list
      security:
        - {}
        - OwnerToken: []
      summary: List files
      tags:
        - Files
    post:
      description: >-
        Stores a file via multipart upload and returns a download link. Only safe file types accepted. Reuse existing
        owner token to group entities under one owner
      operationId: upload
      parameters:
        - description: >-
            Namespace (default public). Custom namespaces are unlisted, accessible to anyone with the URL. Public
            discovery additionally requires eligibility and no password.
          in: query
          name: ns
          required: false
          schema:
            default: public
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - description: Comma-separated tags
          example: demo,test
          in: query
          name: tags
          required: false
          schema:
            type: string
        - description: >-
            TTL in integer days (1-30); accepts 15, 15d, 15 day or 15 days, case-insensitive. Omitted or blank uses 15
            days.
          in: query
          name: ttl
          required: false
          schema:
            pattern: ^\s*(?:\d+\s*(?:[dD]|[dD][aA][yY][sS]?)?)?\s*$
            type: string
        - description: >-
            Access password. Empty = public file visible in gallery. With password = hidden from gallery; readers unlock
            the publication or use X-Password for API access
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: Reuse existing owner token to group entities under one owner. If omitted, a new token is generated
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
        - in: header
          name: X-Delivery-Mode
          required: false
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  format: binary
                  type: string
              required:
                - file
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
          description: File uploaded
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request or file too large
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unsupported file type
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limit exceeded
      security:
        - {}
        - OwnerToken: []
      summary: Upload file
      tags:
        - Files
  /api/files/{ns}/{id}:
    delete:
      description: Permanently removes the file from storage
      operationId: delete_2
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation. Required for update and delete
          in: header
          name: X-Owner-Token
          required: true
          schema:
            type: string
      responses:
        '204':
          description: File deleted
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: File not found or expired
      security:
        - OwnerToken: []
      summary: Delete file
      tags:
        - Files
    get:
      description: Returns file inline for previewable types (images, PDF, media) or as attachment. Add ?dl=1 to force download.
      operationId: download
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Access password via header
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: >-
            Legacy-only query password; ignored for NEW publications. Programmatic access uses X-Password or the owner
            token.
          in: query
          name: p
          required: false
          schema:
            type: string
        - description: Force download as attachment
          in: query
          name: dl
          required: false
          schema:
            type: boolean
        - in: header
          name: Range
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: Owner token to bypass password protection when no password supplied
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
          description: File content
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong password
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: File not found or expired
      security:
        - {}
        - OwnerToken: []
        - Password: []
      summary: Download file
      tags:
        - Files
  /api/gallery:
    get:
      description: >-
        Lists public pages (public namespace, no password) with optional case-insensitive search by title/tags. When
        `mine=true` and `X-Owner-Token` is supplied, results are restricted to the caller's own public publications.
      operationId: getGallery
      parameters:
        - description: Case-insensitive search by title or tags
          in: query
          name: q
          required: false
          schema:
            type: string
        - description: Page number (1-based)
          example: 1
          in: query
          name: page
          required: false
          schema:
            default: 1
            format: int32
            type: integer
        - description: Items per page (max 100)
          example: 20
          in: query
          name: size
          required: false
          schema:
            default: 20
            format: int32
            type: integer
        - description: 'Sort order: ''date'' (newest first, default) or ''views'' (most viewed first)'
          example: date
          in: query
          name: sort
          required: false
          schema:
            default: date
            type: string
        - description: When true, restrict results to the caller's owner_id (requires X-Owner-Token)
          in: query
          name: mine
          required: false
          schema:
            type: boolean
        - description: Owner token; required when mine=true
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryResponse'
          description: Paginated gallery items
      security:
        - {}
        - OwnerToken: []
      summary: Browse gallery
      tags:
        - Gallery
  /api/html:
    post:
      description: >-
        Stores HTML or markdown content and returns a shareable link. Reuse existing owner token to group entities under
        one owner. Also accepts raw text/* (HTML, Markdown, YAML, XML, CSV, code) and application/octet-stream bodies —
        see /llms-full.txt.
      operationId: create_1
      parameters:
        - description: >-
            Namespace (default public). Custom namespaces are unlisted, accessible to anyone with the URL. Public
            discovery additionally requires eligibility and no password.
          in: query
          name: ns
          required: false
          schema:
            default: public
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - description: Comma-separated tags
          example: demo,test
          in: query
          name: tags
          required: false
          schema:
            type: string
        - description: >-
            TTL in integer days (1-30); accepts 15, 15d, 15 day or 15 days, case-insensitive. Omitted or blank uses 15
            days.
          in: query
          name: ttl
          required: false
          schema:
            pattern: ^\s*(?:\d+\s*(?:[dD]|[dD][aA][yY][sS]?)?)?\s*$
            type: string
        - description: >-
            Content format. 'html' (default) — stored verbatim. 'markdown' / 'md' — rendered to styled HTML via
            github-markdown-css. Code/text languages stored and served raw with format-specific MIME (text/csv,
            application/json, text/xml, text/plain) plus X-Content-Type-Options: nosniff: yaml, json, xml, csv, tsv,
            log, toml, ini, sql, sh, bat, env, javascript, typescript, tsx, jsx, css, properties, docker, txt
          in: query
          name: format
          required: false
          schema:
            default: html
            type: string
        - description: >-
            Access password. Empty means no password restriction; public discovery additionally requires eligibility.
            Protected pages are hidden from the gallery. OLD links accept ?p=; NEW access uses X-Password or a reader
            access cookie after password entry.
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: Reuse existing owner token to group entities under one owner. If omitted, a new token is generated
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: >-
            NEW delivery preference: path or subdomain. Non-public namespaces require subdomain; omission allows smart
            selection.
          in: header
          name: X-Delivery-Mode
          required: false
          schema:
            enum:
              - path
              - subdomain
            type: string
      requestBody:
        content:
          application/javascript:
            schema:
              type: string
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlUploadRequest'
          application/octet-stream:
            schema:
              format: binary
              type: string
          application/toml:
            schema:
              type: string
          application/x-yaml:
            schema:
              type: string
          application/xml:
            schema:
              type: string
          application/yaml:
            schema:
              type: string
          text/css:
            schema:
              type: string
          text/csv:
            schema:
              type: string
          text/html:
            schema:
              type: string
          text/javascript:
            schema:
              type: string
          text/markdown:
            schema:
              type: string
          text/plain:
            schema:
              type: string
          text/x-toml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
          text/yaml:
            schema:
              type: string
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlUploadResponse'
          description: Page created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request parameters
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limit exceeded
      security:
        - {}
        - OwnerToken: []
      summary: Create HTML page
      tags:
        - HTML
  /api/html/{ns}/{id}:
    delete:
      description: Permanently removes page and frees the short URL
      operationId: delete_1
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation. Required for update and delete
          in: header
          name: X-Owner-Token
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Page deleted
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Page not found or expired
      security:
        - OwnerToken: []
      summary: Delete HTML page
      tags:
        - HTML
    get:
      description: >-
        Returns rendered HTML content. Protected OLD pages accept X-Password or ?p=; NEW pages use X-Password or a
        reader access cookie. The owner token bypasses password protection when no password is supplied.
      operationId: getById_1
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Access password via header
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: >-
            Legacy-only query password; ignored for NEW publications. Programmatic access uses X-Password or the owner
            token.
          in: query
          name: p
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: Owner token to bypass password protection when no password supplied
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            text/tab-separated-values:
              schema:
                type: string
            text/xml:
              schema:
                type: string
          description: HTML content
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong password
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Page not found or expired
      security:
        - {}
        - OwnerToken: []
        - Password: []
      summary: Get HTML page
      tags:
        - HTML
    put:
      description: >-
        Replaces page content; requires the owner token returned at creation. Also accepts raw text/* (HTML, Markdown,
        YAML, XML, CSV, code) bodies — see /llms-full.txt.
      operationId: update_1
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation. Required for update and delete
          in: header
          name: X-Owner-Token
          required: true
          schema:
            type: string
        - description: >-
            Optional new content format on republish. Accepts 'html', 'markdown'/'md', or any code format (yaml, json,
            xml, csv, tsv, log, toml, ini, sql, sh, bat, env, javascript, typescript, tsx, jsx, css, properties, docker,
            txt). When omitted, the row's stored format is preserved. Body field 'format' on HtmlUpdateRequest takes
            precedence over the query param when both are present.
          in: query
          name: format
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/javascript:
            schema:
              type: string
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlUpdateRequest'
          application/toml:
            schema:
              type: string
          application/x-yaml:
            schema:
              type: string
          application/xml:
            schema:
              type: string
          application/yaml:
            schema:
              type: string
          text/css:
            schema:
              type: string
          text/csv:
            schema:
              type: string
          text/html:
            schema:
              type: string
          text/javascript:
            schema:
              type: string
          text/markdown:
            schema:
              type: string
          text/plain:
            schema:
              type: string
          text/x-toml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
          text/yaml:
            schema:
              type: string
        required: true
      responses:
        '200':
          content:
