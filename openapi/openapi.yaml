          in: query
          name: tag
          required: false
          schema:
            type: string
        - description: Only secrets created at or after this ISO-8601 instant
          in: query
          name: since
          required: false
          schema:
            type: string
        - description: Only secrets expiring within 7 days
          in: query
          name: expiring
          required: false
          schema:
            default: false
