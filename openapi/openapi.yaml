        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: key
          required: true
          schema:
            type: string
        - description: Access password via header
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: >-
            Legacy-only query password; ignored for NEW publications. Programmatic access uses X-Password or the owner
            token.
          in: query
          name: p
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: Owner token to bypass password protection when no password supplied
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KvGetResponse'
          description: Key value
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong password
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Store or key not found
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Public publication deleted or expired
      security:
        - {}
        - OwnerToken: []
        - Password: []
      summary: Get key value
      tags:
        - KV
    put:
      description: Creates or updates a key in the store; max 1000 keys per store
      operationId: upsertKey
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: key
          required: true
          schema:
            type: string
        - in: header
          name: X-Delivery-Mode
          required: false
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
        - description: Management key of this store
          in: header
          name: X-Manage-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KvUpsertKeyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KvUpsertKeyResponse'
          description: Key upserted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid key or value; key name `hosting` is reserved
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token or management key
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Store not found or expired
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Key limit exceeded, or old publication is read-only (code: OLD_PUBLICATION_READ_ONLY; publish anew via
            createUrl)
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
      security:
        - OwnerToken: []
        - ManageKey: []
      summary: Upsert key
      tags:
        - KV
  /api/limits:
    get:
      description: >-
        Returns the size, count, TTL and file-type limits for HTML, JSON, KV, files and sites. Sizes are bytes;
        `maxTotalBytes` counts uncompressed files, `maxArchiveExpansionBytes` every inflated ZIP byte including skipped
        system files (`skippedFileNames`, `skippedRootFolders`), which never count toward the limits. `reach` is always
        sent: `profile` only for an `X-Owner-Token` active in a profile, else `token`; `ownerMaxTtlDays` only for a
        usable `X-Owner-Token`; an unusable token gets the anonymous answer.
