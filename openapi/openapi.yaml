    name: Owner Token
  - description: >-
      Browse public content from the 'public' namespace without password protection; mine=true lists the caller's own
      publications
    name: Gallery
  - description: >-
      Password-style secrets behind a link that stops working after the allowed views or at expiry. The client encrypts
      with AES-GCM-256 and keeps the key in the link's #fragment: the server stores only ciphertext and never sees the
      key or the text. Never listed, indexed or shown anywhere else.
    name: One-time secrets
  - description: Short URL resolver for sharing
    name: Short Links
  - description: Lightweight owner-token probe; never increments views or returns content
    name: Owner Check
  - description: HTML page hosting with markdown support
    name: HTML
  - description: 'User-facing upload limits: one source for the UI, agents and docs'
    name: Limits
  - description: 'Official BrewPage templates: ready pages to copy and publish instead of writing one from scratch'
    name: Templates
  - description: Multi-file HTML site hosting via ZIP or folder upload
    name: Sites
  - description: Owner list and stats
    name: Publications
  - description: >-
      Serve an HTML page or a site on your own domain, free with a BrewPage profile. Set the hostname, create the DNS
      records the answer lists, call check once, then read the domain until the status is active.
    name: Custom Domains
  - description: >-
      What visitors saved on your HTML page or site: settings, entries, files, totals, CSV export, author entries,
      deletes. Visitors save through the page itself, not through this API: the page loads
      https://brewpage.app/js/state.js and calls bp.state(), which uses the host API /_bp/state/v1 on the page's own
      address (https://<label>.brewpage.app). That host API serves only its own page; its contract is a separate
      document: https://kochetkov-ma.github.io/brewpage-openapi/page-data-host.json. Turn page data on with `state` when
      you publish, or with PATCH /api/{ns}/{id}/state. Each visitor reads and writes only their own entries unless a
      list is shared; you, the author, read them all.
    name: Page data
  - description: >-
      Social previews: per-content OpenGraph image (1200×630 JPEG; .png is a legacy URL alias) and OG meta stub for
      social bots
    name: preview
  - description: Search engine optimization endpoints
    name: SEO
  - description: JSON document store with up to 10,000 docs per collection
    name: JSON
  - description: Platform-wide usage statistics
    name: Stats
  - description: Fresh, collision-free namespace suggestions
    name: Namespace
  - description: File hosting up to 5 MB per file (video 20 MB), 1000 files per namespace
    name: Files
  - description: Owner-only publication delivery settings
    name: Hosting Management
  - description: >-
      Your profile's notifications: notices (pages expiring, removed or full, new entries, BrewPage news) and activity
      (pages published or updated). Send X-Owner-Token with a token added to exactly one BrewPage profile; any such
      token reads, marks read, deletes and switches a page, changing the settings needs an admin token.
    name: Notifications
  - description: Abuse reports for hosted content
    name: Reports
