        mobile:
          format: int32
          type: integer
        tablet:
          format: int32
          type: integer
      type: object
    StatsHost:
      properties:
        host:
          type: string
        'n':
          format: int32
          type: integer
      type: object
    StatsResponse:
      properties:
        accountsToday:
          description: Accounts created today, deleted ones excluded
          format: int64
          type:
            - integer
            - 'null'
        breakdown:
          description: Per-type breakdown (html, json, kv, file, site)
          items:
            $ref: '#/components/schemas/TypeBreakdown'
          type: array
        createdToday:
          description: Resources created in the last 24 hours
          format: int64
