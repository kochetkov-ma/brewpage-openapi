          type:
            - integer
            - 'null'
        id:
          description: Unique 10-character alphanumeric file ID
          type: string
        link:
          description: Primary URL returned for browser download and sharing
          type: string
        managementLink:
          type:
            - string
            - 'null'
        modeLocked:
          type: boolean
        namespace:
          type: string
        ownerLink:
          description: API URL for programmatic access (delete)
