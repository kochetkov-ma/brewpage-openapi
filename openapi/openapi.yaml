      tags:
        - KV
    post:
      description: >-
        Creates a new store with an initial key-value pair and returns a shareable link. Reuse existing owner token to
        group entities under one owner. Secrets allowed; likely ones are flagged in notices. To share a password or key:
        POST /api/secrets (client-side encrypted one-time link).
      operationId: createStore
      parameters:
        - description: >-
            No ns (default): private. ns=public: the shared public namespace. JSON and KV are never listed in the
            gallery or indexed, in any namespace; anyone who has the link can open it. Lowercase only.
          in: query
          name: ns
          required: false
          schema:
            pattern: ^$|^[a-z0-9-]{1,32}$
            type: string
        - description: Comma-separated tags
          example: demo,test
          in: query
          name: tags
          required: false
          schema:
            type: string
        - description: >-
            TTL in days: up to 30 days without an account, up to 90 with a free profile (send its X-Owner-Token); a
            default applies when `ttl` is omitted. Accepts whole days: 15, 15d, 15 days.
          in: query
          name: ttl
          required: false
          schema:
            type: string
        - description: >-
            Access password; protected stores are unlisted. NEW browser links use trusted unlock; programmatic reads use
            X-Password
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: 'Delivery mode for a new store: path or subdomain'
          in: header
          name: X-Delivery-Mode
          required: false
          schema:
            type: string
        - description: Reuse existing owner token to group entities under one owner. If omitted, a new token is generated
          in: header
          name: X-Owner-Token
