          name: X-Delivery-Mode
          required: false
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              anyOf:
                - required:
                    - archive
                  type: object
                - required:
                    - files
                  type: object
              properties:
                archive:
                  description: ZIP archive; takes precedence over individual files.
                  format: binary
                  type: string
                files:
                  items:
                    format: binary
                    type: string
                  minItems: 1
                  type: array
                paths:
                  description: Optional paths aligned with files; omitted paths use original filenames.
                  items:
                    type: string
                  type: array
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteUploadResponse'
          description: Site uploaded
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request, no HTML files, or limits exceeded
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unsupported file type in archive
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limit exceeded
      security:
        - {}
        - OwnerToken: []
      summary: Upload site
      tags:
        - Sites
  /api/sites/{ns}/{id}:
    delete:
      description: Permanently removes the site and all its files from storage
      operationId: deleteSite
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation. Required for delete
          in: header
          name: X-Owner-Token
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Site deleted
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Site not found
      security:
        - OwnerToken: []
      summary: Delete site
      tags:
        - Sites
    get:
      description: Returns site metadata and file list. Requires owner token
      operationId: getSiteInfo
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token returned at creation
          in: header
          name: X-Owner-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteInfoResponse'
          description: Site info
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Site not found
      security:
        - OwnerToken: []
      summary: Get site info
      tags:
        - Sites
    put:
      description: >-
        Replaces the multi-file site bundle (ZIP archive or individual files with paths). Requires the owner token
        returned at creation. Password is preserved as-is (not changed in this operation).
      operationId: republishSite
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Comma-separated tags
          example: demo,portfolio
          in: query
          name: tags
          required: false
          schema:
            type: string
        - description: >-
            TTL in integer days (1-30); accepts 15, 15d, 15 day or 15 days, case-insensitive. Omission preserves the
            original expiry; updates do not renew it.
          in: query
          name: ttl
          required: false
          schema:
            pattern: ^\s*(?:\d+\s*(?:[dD]|[dD][aA][yY][sS]?)?)?\s*$
            type: string
        - description: 'Entry file path override (default: auto-detect index.html)'
          in: query
          name: entry
          required: false
          schema:
            type: string
        - description: Owner token returned at creation. Required for update
          in: header
          name: X-Owner-Token
          required: true
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              anyOf:
                - required:
                    - archive
                  type: object
                - required:
                    - files
                  type: object
              properties:
                archive:
                  description: ZIP archive; takes precedence over individual files.
                  format: binary
                  type: string
                files:
                  items:
                    format: binary
                    type: string
                  minItems: 1
                  type: array
                paths:
                  description: Optional paths aligned with files; omitted paths use original filenames.
                  items:
                    type: string
                  type: array
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteUpdateResponse'
          description: Site updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request, empty bundle, limits exceeded, or bad TTL
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Site not found or expired
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Site is no longer available
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unsupported file type in archive
      security:
        - OwnerToken: []
      summary: Update site
      tags:
        - Sites
  /api/sites/{ns}/{id}/files/{filePath}:
    get:
      description: Serves an individual file from the site with correct content type
      operationId: serveSiteFile
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            pattern: ^[a-z0-9-]{1,32}$
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Access password via header
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: >-
            Legacy-only query password; ignored for NEW publications. Programmatic access uses X-Password or the owner
            token.
          in: query
          name: p
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - description: Owner token to bypass password protection when no password supplied
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
        - in: header
          name: Range
          required: false
          schema:
            type: string
        - description: Relative file path, including nested directories; encode each segment and retain slash separators.
          in: path
          name: filePath
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
          description: File content
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong password
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Site or file not found
      security:
        - {}
        - OwnerToken: []
        - Password: []
      summary: Serve site file
      tags:
        - Sites
  /api/stats:
    get:
      description: >-
        Returns today's and all-time creation/view counts with per-type breakdown. Optional 'tz' query param (IANA id)
        controls the boundary of 'today'; defaults to UTC.
      operationId: getStats
      parameters:
        - description: 'IANA timezone id for the ''today'' boundary. Defaults to UTC. Example: Europe/Lisbon'
          in: query
          name: tz
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
          description: Platform statistics
      summary: Get platform stats
      tags:
        - Stats
  /api/{ns}/{id}/owner-check:
    get:
      description: >-
        Returns `{isOwner, type}`, plus `format` for an `html`-type resource. Constant-time BCrypt match. 404 when the
        resource does not exist (or has expired). 200 with `isOwner:false` when the X-Owner-Token header is absent.
      operationId: ownerCheck
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Owner token to verify (constant-time match)
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerCheckResponse'
          description: OK
      security:
        - {}
        - OwnerToken: []
      summary: Verify whether the supplied X-Owner-Token owns the resource
      tags:
        - Owner Check
  /api/{type}/{ns}/{id}/access/revoke:
    post:
      operationId: revokeReaderAccess
      parameters:
        - in: path
          name: type
          required: true
          schema:
            enum:
              - html
              - files
              - json
              - kv
              - sites
            type: string
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Owner-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRevokeResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Reader access revocation requires a NEW protected publication
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Publication unavailable
      security:
        - OwnerToken: []
      summary: Revoke reader access to a new protected publication
      tags:
        - Hosting Management
  /api/{type}/{ns}/{id}/hosting:
    get:
      operationId: getHosting
      parameters:
        - in: path
          name: type
          required: true
          schema:
            enum:
              - html
              - files
              - json
              - kv
              - sites
            type: string
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Owner-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostingProjection'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Publication unavailable
      security:
        - OwnerToken: []
      summary: Read owner-only publication delivery settings
      tags:
        - Hosting Management
    patch:
      operationId: updateHosting
      parameters:
        - in: path
          name: type
          required: true
          schema:
            enum:
              - html
              - files
              - json
              - kv
            type: string
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Owner-Token
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostingUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostingProjection'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid mode/version or locked delivery mode
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or wrong owner token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Publication unavailable
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Hosting version conflict
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Hosting changes temporarily unavailable
      security:
        - OwnerToken: []
      summary: Change delivery mode for a new public publication
      tags:
        - Hosting Management
  /galleries:
    get:
      description: >-
        Renders a minimal, bot-friendly anchor index of every current public site, page, image and video. Sorted by
        popularity (top 50 by views) then by recency. Underlying data is cached for ~2h.
      operationId: galleries
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: string
          description: HTML index page
      summary: Flat HTML index of all current public publications
      tags:
        - SEO
  /preview-html/{ns}/{id}:
    get:
      description: Tiny HTML response with og:title/og:description/og:image meta tags for social-bot unfurls
      operationId: previewHtml
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: HTML stub with OG meta (or generic stub when resource is missing)
      summary: OpenGraph HTML stub
      tags:
        - preview
  /preview/{ns}/{id}.png:
    get:
      description: Returns 1200×630 PNG, cached, with ETag/If-None-Match support; falls back to /og-image.png?v=2 on any failure
      operationId: preview
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            image/png:
              schema:
                format: binary
                type: string
          description: PNG image bytes
        '302':
          description: Fallback to static og-image.png (flag off, no source, generation error, oversized)
        '304':
          description: Not modified (If-None-Match matched current ETag)
        '429':
          description: Per-IP rate limit exceeded
      summary: Per-content OG image
      tags:
        - preview
  /{key}.txt:
    get:
      description: Serves the IndexNow verification key file for search engine crawlers
      operationId: serveKeyFile
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: Key file content
        '404':
          description: Unknown key
      summary: IndexNow key verification
      tags:
        - SEO
  /{ns}/{id}:
    get:
      operationId: resolve
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Access password for protected resources
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: >-
            Legacy-only query password; ignored for NEW publications. Programmatic access uses X-Password or the owner
            token.
          in: query
          name: p
          required: false
          schema:
            type: string
        - description: Force download as attachment
          in: query
          name: dl
          required: false
          schema:
            type: boolean
        - description: 'Bypass SPA: stream raw bytes directly (used by <video src>, <iframe src> for PDF, embed cases)'
          in: query
          name: raw
          required: false
          schema:
            type: boolean
        - description: Legacy site wrapper bypass; NEW publications retain stored hosting and protection policies
          in: query
          name: inline
          required: false
          schema:
            type: boolean
        - in: header
          name: Range
          required: false
          schema:
            type: string
        - in: header
          name: X-Resolve
          required: false
          schema:
            type: string
        - description: 'Owner token; when supplied, response carries X-Is-Owner: true on match'
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
        - in: header
          name: Accept
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
          description: OK
      security:
        - {}
        - OwnerToken: []
        - Password: []
      tags:
        - Short Links
  /{ns}/{id}/{sub}:
    get:
      operationId: resolveWithSub
      parameters:
        - in: path
          name: ns
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: sub
          required: true
          schema:
            type: string
        - description: Access password for protected resources
          in: header
          name: X-Password
          required: false
          schema:
            type: string
        - description: >-
            Legacy-only query password; ignored for NEW publications. Programmatic access uses X-Password or the owner
            token.
          in: query
          name: p
          required: false
          schema:
            type: string
        - description: Force download as attachment
          in: query
          name: dl
          required: false
          schema:
            type: boolean
        - in: header
          name: Range
          required: false
          schema:
            type: string
        - in: header
          name: X-Resolve
          required: false
          schema:
            type: string
        - description: 'Owner token; when supplied, response carries X-Is-Owner: true on match'
          in: header
          name: X-Owner-Token
          required: false
          schema:
            type: string
        - in: header
          name: User-Agent
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: object
          description: OK
      security:
        - {}
        - OwnerToken: []
        - Password: []
      tags:
        - Short Links
servers:
  - url: https://brewpage.app
tags:
  - description: Key-Value store with up to 1000 keys per store
    name: KV
  - description: Per-content OpenGraph image (1200×630 PNG)
    name: preview
  - description: Short URL resolver for sharing
    name: Short Links
  - description: Lightweight owner-token probe; never increments views or returns content
    name: Owner Check
  - description: HTML page hosting with markdown support
    name: HTML
  - description: Multi-file HTML site hosting via ZIP or folder upload
    name: Sites
  - description: Mints a fresh owner token client-side; stateless, persists nothing
    name: Owner Token
  - description: Search engine optimization endpoints
    name: SEO
  - description: Browse public content from the 'public' namespace without password protection
    name: Gallery
  - description: JSON document store with up to 10,000 docs per collection
    name: JSON
  - description: Platform-wide usage statistics
    name: Stats
  - description: Fresh, collision-free namespace suggestions
    name: Namespace
  - description: Owner-only publication delivery settings
    name: Hosting Management
  - description: OpenGraph metadata for social bots
    name: preview
  - description: File hosting up to 5 MB per file, 1000 files per namespace
    name: Files
  - description: Abuse reports for hosted content
    name: Reports
