        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KvCreateStoreRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KvCreateStoreResponse'
          description: Store created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request parameters
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Owner token revoked or expired
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: >-
            Rate limited: wait Retry-After (= retryAfterSeconds); no account: accountUrl, free sign-up with higher
            limits
      security:
        - {}
        - OwnerToken: []
      summary: Create KV store
      tags:
        - KV
