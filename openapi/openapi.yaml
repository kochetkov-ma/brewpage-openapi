          type: string
        deliveryMode:
          type:
            - string
            - 'null'
        deliveryModeMatched:
          type:
            - boolean
            - 'null'
        deliveryModeReason:
          description: >-
            Set as 'advisory:<codes>' when the updated page stays on a BrewPage link but uses browser features that may
            not work fully there. An update never changes the delivery mode. Codes are comma-separated in a fixed order:
            storage, cookies, history, downloads, top-navigation, media-capture, pointer-lock, embeds, fullscreen.
            Absent when nothing applies.
          type: string
        deliveryNotice:
          description: Human-readable explanation of deliveryModeReason. Absent whenever deliveryModeReason is absent.
