            'verbatim'); omitted, source code or JSON is saved as its code format (notice format-detected). 'markdown' /
            'md' — rendered to styled HTML via github-markdown-css. Code/text languages stored and served raw with
            format-specific MIME (text/csv, application/json, text/plain) plus X-Content-Type-Options: nosniff; raw
            reads of xml answer text/plain, downloads keep text/xml: yaml, json, xml, csv, tsv, log, toml, ini, sql, sh,
            bat, env, javascript, typescript, tsx, jsx, css, properties, docker, txt. Decides over a filename extension;
            unknown values are ignored. A whole HTML document sent as 'markdown' is published as an HTML page.
          in: query
          name: format
          required: false
          schema:
            default: html
            type: string
        - description: >-
            Access password. Empty means no password restriction. Protected pages are never listed in the gallery or
            sitemap. OLD links accept ?p=; NEW access uses X-Password or a reader access cookie after password entry.
