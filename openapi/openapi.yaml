# Generated from backend public JSON; do not hand-edit.
components:
  schemas:
    AbuseResult:
      properties:
        action:
          enum:
            - created
            - created_missing_assets
            - updated
            - merged
            - created_warned
            - unavailable
            - rate_limited
            - rejected
          type: string
        code:
          enum:
            - success
            - duplicate
            - warned
            - failed
          type: string
        extras:
          additionalProperties: {}
          type: object
        reason:
          type: string
      required:
        - action
        - code
      type: object
    AccessRevokeResponse:
      properties:
        revoked:
          type: boolean
      type: object
    ErrorResponse:
