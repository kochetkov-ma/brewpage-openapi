        - One-time secrets
    post:
      description: >-
        Stores client-side encrypted text or one file for 1 to 10 views (default 1) and 1h, 1d, 7d or 30d (default 7d),
        with a title the recipient sees. Owned like a publication: send X-Owner-Token (none: a new one is returned).
        Share https://brewpage.app/secret/{id}#{key} with the key only in the fragment; manageUrl is for the creator
        only.
      operationId: createSecret
      parameters:
        - description: Reuse your owner token so the secret joins your other publications. If omitted, a new token is generated
          in: header
