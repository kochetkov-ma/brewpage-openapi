          schema:
            type: string
        - description: Page number (1-based)
          example: 1
          in: query
          name: page
          required: false
          schema:
            default: 1
            format: int32
            type: integer
        - description: Items per page (max 100)
          example: 20
          in: query
          name: size
          required: false
          schema:
            default: 20
            format: int32
